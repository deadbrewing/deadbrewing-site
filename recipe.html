
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080d13">
  <title>Recipe | DeadBrewing</title>

  <style>
    :root {
      --bg: #080d13;
      --panel: #111b27;
      --panel2: #172534;
      --blue: #79cfff;
      --rust: #d77b37;
      --text: #e4eaf0;
      --muted: #a2b0be;
      --border: #354b60;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(ellipse at 50% 0%, #152b40, transparent 55%),
        var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.6;
    }

    header {
      background: #0b121c;
      border-bottom: 2px solid var(--rust);
      padding: 22px 18px;
      text-align: center;
    }

    .brand {
      color: var(--blue);
      font-size: clamp(28px, 6vw, 46px);
      font-weight: 900;
      letter-spacing: 4px;
      text-decoration: none;
      text-transform: uppercase;
    }

    nav {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px 24px;
      margin-top: 16px;
    }

    nav a {
      color: var(--text);
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 1px;
      text-decoration: none;
      text-transform: uppercase;
    }

    nav a:hover,
    nav a[aria-current="page"] {
      color: var(--blue);
    }

    main {
      max-width: 950px;
      margin: auto;
      padding: 40px 18px 80px;
    }

    .back-link {
      display: inline-block;
      color: var(--blue);
      text-decoration: none;
      font-size: 13px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 28px;
    }

    .back-link:hover {
      color: white;
    }

    .recipe {
      background: var(--panel);
      border: 1px solid var(--border);
      border-top: 3px solid var(--rust);
      border-radius: 9px;
      overflow: hidden;
    }

    .hero {
      height: clamp(230px, 40vw, 420px);
      background:
        radial-gradient(circle at center, #244764, #101923 75%);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .hero img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .placeholder {
      color: #7597ad;
      font-size: 100px;
      opacity: .6;
    }

    .recipe-body {
      padding: 30px;
    }

    .style {
      color: var(--rust);
      text-transform: uppercase;
      letter-spacing: 2px;
      font-size: 12px;
      font-weight: bold;
    }

    h1 {
      color: white;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-size: clamp(29px, 5vw, 46px);
      margin: 10px 0;
    }

    .description {
      color: var(--muted);
      max-width: 750px;
      margin: 15px 0 26px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin: 25px 0 30px;
    }

    .stat {
      background: var(--panel2);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 15px 8px;
      text-align: center;
    }

    .stat-label {
      display: block;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 1px;
      font-weight: bold;
    }

    .stat-value {
      display: block;
      font-size: clamp(15px, 2.5vw, 22px);
      font-weight: bold;
      margin-top: 5px;
    }

    details {
      background: #0d1621;
      border: 1px solid var(--border);
      border-radius: 5px;
      margin-top: 11px;
      overflow: hidden;
    }

    summary {
      color: var(--blue);
      cursor: pointer;
      padding: 15px 18px;
      font-weight: bold;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    summary:hover {
      background: var(--panel2);
    }

    details[open] summary {
      border-bottom: 1px solid var(--border);
    }

    .detail-content {
      padding: 10px 18px 15px;
    }

    .detail-row {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      padding: 10px 0;
      border-bottom: 1px solid #263545;
      font-size: 14px;
    }

    .detail-row:last-child {
      border-bottom: none;
    }

    .detail-row span:last-child {
      color: #f2d7aa;
      text-align: right;
    }

    .detail-text {
      white-space: pre-line;
      font-size: 14px;
    }

    .crypt-notes {
      border-color: var(--rust);
    }

    .crypt-notes summary {
      color: #f3b77b;
    }

    .message {
      text-align: center;
      color: var(--muted);
      padding: 50px 15px;
    }

    footer {
      border-top: 1px solid var(--border);
      padding: 28px 15px;
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 1px;
    }

    @media (max-width: 600px) {
      main {
        padding: 25px 12px 50px;
      }

      .recipe-body {
        padding: 20px 15px;
      }

      .stats {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .detail-row {
        flex-direction: column;
        gap: 2px;
      }

      .detail-row span:last-child {
        text-align: left;
      }
    }
  </style>
</head>

<body>

  <header>
    <a class="brand" href="index.html">DeadBrewing</a>

    <nav>
      <a href="index.html">Home</a>
      <a href="journal.html" aria-current="page">Brew Journal</a>
      <a href="crypt.html">The Crypt</a>
      <a href="vip.html">VIP</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <main>
    <a class="back-link" href="journal.html">
      &larr; Back to Brew Journal
    </a>

    <div id="recipe-container">
      <p class="message">Loading recipe...</p>
    </div>
  </main>

  <footer>
    DEADBREWING &bull; BREWED AFTER DARK
  </footer>

  <script>
    function escapeHTML(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function hasValue(value) {
      return value !== null &&
             value !== undefined &&
             String(value).trim() !== "";
    }

    function display(value) {
      return hasValue(value)
        ? escapeHTML(value)
        : "Pending";
    }

    function rows(items) {
      if (!Array.isArray(items) || !items.length) {
        return "";
      }

      return items.map(item => `
        <div class="detail-row">
          <span>${escapeHTML(item.label)}</span>
          <span>${display(item.value)}</span>
        </div>
      `).join("");
    }

    function section(title, items, extraClass = "") {
      const content = rows(items);

      if (!content) return "";

      return `
        <details class="${extraClass}">
          <summary>${escapeHTML(title)}</summary>
          <div class="detail-content">
            ${content}
          </div>
        </details>
      `;
    }

    function textSection(title, value) {
      if (!hasValue(value)) return "";

      return `
        <details>
          <summary>${escapeHTML(title)}</summary>
          <div class="detail-content detail-text">
            ${escapeHTML(value)}
          </div>
        </details>
      `;
    }

    function renderRecipe(recipe) {
      const container = document.getElementById(
        "recipe-container"
      );

      const artwork = recipe.artwork
        ? `<img src="${escapeHTML(recipe.artwork)}"
                alt="${escapeHTML(recipe.name)} artwork">`
        : `<div class="placeholder">☠</div>`;

      const stats = [
        ["OG", recipe.og],
        ["FG", recipe.fg],
        ["ABV", hasValue(recipe.abv) ? recipe.abv + "%" : null],
        ["IBU", recipe.ibu]
      ];

      const statHTML = stats.map(([label, value]) => `
        <div class="stat">
          <span class="stat-label">${label}</span>
          <span class="stat-value">${display(value)}</span>
        </div>
      `).join("");

      container.innerHTML = `
        <article class="recipe">
          <div class="hero">${artwork}</div>

          <div class="recipe-body">
            <div class="style">
              ${escapeHTML(recipe.style)}
            </div>

            <h1>${escapeHTML(recipe.name)}</h1>

            <p class="description">
              ${escapeHTML(recipe.description)}
            </p>

            <div class="stats">
              ${statHTML}
            </div>

            ${section("Grain Bill", recipe.grain)}
            ${section("Hop Schedule", recipe.hops)}
            ${section("Water Profile", recipe.water)}
            ${section("Mash Schedule", recipe.mash)}
            ${section("Fermentation", recipe.fermentation)}

            ${section(
              "☠ Crypt Notes",
              recipe.cryptNotes,
              "crypt-notes"
            )}

            ${textSection(
              "Brewer's Verdict",
              recipe.tastingNotes
            )}
          </div>
        </article>
      `;

      document.title = recipe.name + " | DeadBrewing";
    }

    async function loadRecipe() {
      const container = document.getElementById(
        "recipe-container"
      );

      const params = new URLSearchParams(
        window.location.search
      );

      const id = params.get("id");

      if (!id) {
        container.innerHTML =
          '<p class="message">No recipe selected.</p>';
        return;
      }

      try {
        const response = await fetch("journal.json", {
          cache: "no-store"
        });

        if (!response.ok) {
          throw new Error("Could not load journal.json");
        }

        const data = await response.json();

        const allRecipes = [
          ...(Array.isArray(data.batches) ? data.batches : []),
          ...(Array.isArray(data.recipes) ? data.recipes : [])
        ];

        const recipe = allRecipes.find(
          item => item.id === id
        );

        if (!recipe) {
          container.innerHTML =
            '<p class="message">Recipe not found.</p>';
          return;
        }

        renderRecipe(recipe);

      } catch (error) {
        console.error("Recipe error:", error);

        container.innerHTML =
          '<p class="message">Unable to load recipe.</p>';
      }
    }

    loadRecipe();
  </script>

</body>
</html>
