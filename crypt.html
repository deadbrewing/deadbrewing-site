
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>The Crypt | DeadBrewing</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  min-height: 100%;
  background: #080606;
  color: #ffe4b5;
  font-family: Georgia, serif;
}

.viewport {
  width: 100%;
}

.page {
  position: relative;
  width: min(100vw, 177.37vh, 1646px);
  aspect-ratio: 16 / 9;
  margin: 0 auto;

  background-image:
    url("deadbrewing-crypt-scene-blank-plaque.png?v=2");

  background-size: 100% 100%;
  background-position: center;
  background-repeat: no-repeat;
}

/* Live count directly on the blank parchment */
.soul-count {
  position: absolute;
  z-index: 5;

  left: 58.5%;
  top: 19.4%;
  width: 20%;
  height: 3.8%;

  display: flex;
  align-items: center;
  justify-content: center;

  background: transparent;
  color: #211007;

  font-weight: bold;
  font-size: clamp(11px, 1.9vh, 21px);
  text-align: center;
  white-space: nowrap;
}

/* Scrollable graveyard */
.graveyard {
  position: absolute;
  z-index: 3;

  left: 30%;
  top: 26%;
  width: 62%;
  height: 54%;

  overflow-y: auto;
  overflow-x: hidden;
  overscroll-behavior: contain;

  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
}

.graveyard::-webkit-scrollbar {
  display: none;
}

/* Three tombstones per row */
.graves {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));

  column-gap: 1.5%;
  row-gap: 10px;

  padding: 0 1% 2%;
  align-content: start;
}

/* Each tombstone scrolls with its text and button */
.grave {
  position: relative;
  display: block;

  width: 100%;
  aspect-ratio: 1 / 1.05;
  min-width: 0;

  background-image:
    url("deadbrewing-tombstone.png?v=2");

  background-size: 100% 100%;
  background-position: center;
  background-repeat: no-repeat;

  color: #ffe5b9;
  text-align: center;
  text-decoration: none;
  text-shadow: 2px 2px 3px #000;

  transition: filter 0.15s ease;
}

.grave:hover {
  filter: brightness(1.25);
}

/* Beer details inside the stone */
.grave-info {
  position: absolute;

  left: 13%;
  top: 26%;
  width: 74%;
  height: 44%;

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;

  gap: 6%;
}

.beer-name {
  font-size: clamp(12px, 2.1vh, 23px);
  font-weight: bold;
  line-height: 1.1;
  overflow-wrap: anywhere;
}

.beer-stats {
  font-size: clamp(10px, 1.6vh, 17px);
  font-weight: bold;
}

.kicked-label {
  font-size: clamp(10px, 1.5vh, 16px);

  /* Keeps KEG KICKED below the gold line */
  transform: translateY(5px);
}

.kicked-date {
  font-size: clamp(12px, 1.9vh, 20px);
  font-weight: bold;
}

/* Message when no beers are retired */
.empty-message {
  padding: 12% 5%;
  grid-column: 1 / -1;

  color: #ffe4b5;
  text-align: center;
  font-weight: bold;
  font-size: clamp(12px, 2vh, 22px);
  text-shadow: 2px 2px 4px #000;
}

/* Clickable area over artwork's Back button */
.back {
  position: absolute;
  z-index: 5;

  left: 5%;
  bottom: 3%;
  width: 19%;
  height: 7%;

  display: block;
}

/* Mobile support */
@media (max-width: 700px) {
  .viewport {
    overflow-x: auto;
  }

  .page {
    min-width: 700px;
  }

  .beer-name {
    font-size: 14px;
  }

  .beer-stats,
  .kicked-label {
    font-size: 11px;
  }

  .kicked-date {
    font-size: 13px;
  }

  .soul-count {
    font-size: 12px;
  }
}
</style>
</head>

<body>

<div class="viewport">

<main class="page" aria-label="DeadBrewing The Crypt">

  <div class="soul-count" id="soul-count">
    LOADING...
  </div>

  <section class="graveyard" aria-label="Retired beers">
    <div class="graves" id="graves"></div>
  </section>

  <a
    class="back"
    href="index.html"
    aria-label="Back to DeadBrewing homepage">
  </a>

</main>

</div>

<script>
const graves = document.getElementById("graves");
const soulCount = document.getElementById("soul-count");

/* Format keg-kicked date */
function formatDate(value) {
  if (!value) {
    return "DATE UNKNOWN";
  }

  const date = new Date(value + "T12:00:00");

  if (Number.isNaN(date.getTime())) {
    return value;
  }

  return date.toLocaleDateString("en-CA", {
    year: "numeric",
    month: "short",
    day: "numeric"
  }).toUpperCase();
}

/* Add text inside a tombstone */
function addText(parent, className, value) {
  const element = document.createElement("div");

  element.className = className;
  element.textContent = value;

  parent.appendChild(element);
}

/* Create a complete clickable tombstone */
function makeGrave(beer) {
  const grave = document.createElement("a");
  grave.className = "grave";

  grave.href =
    "beer.html?id=" + encodeURIComponent(beer.id);

  grave.setAttribute(
    "aria-label",
    "View " + beer.name
  );

  const info = document.createElement("div");
  info.className = "grave-info";

  addText(
    info,
    "beer-name",
    beer.name || "UNKNOWN BEER"
  );

  const abv = beer.abv != null
    ? beer.abv + "% ABV"
    : "— ABV";

  const ibu = beer.ibu != null
    ? beer.ibu + " IBU"
    : "— IBU";

  addText(
    info,
    "beer-stats",
    abv + " | " + ibu
  );

  addText(
    info,
    "kicked-label",
    "KEG KICKED"
  );

  addText(
    info,
    "kicked-date",
    formatDate(beer.ripDate)
  );

  grave.appendChild(info);

  return grave;
}

/* Always load the latest beer information */
async function loadCrypt() {
  try {
    const response = await fetch(
      "beers.json?refresh=" + Date.now(),
      { cache: "no-store" }
    );

    if (!response.ok) {
      throw new Error("Unable to load beer information");
    }

    const data = await response.json();

    const retired = (data.beers || [])
      .filter(beer =>
        String(beer.status).trim().toLowerCase() === "retired"
      )
      .sort((a, b) =>
        (b.ripDate || "").localeCompare(a.ripDate || "")
      );

    const count = retired.length;

    soulCount.textContent =
      count + " SOUL" +
      (count === 1 ? "" : "S") +
      " LAID TO REST";

    graves.replaceChildren();

    if (count === 0) {
      const empty = document.createElement("div");
      empty.className = "empty-message";
      empty.textContent =
        "THE GRAVEYARD AWAITS ITS FIRST SOUL.";

      graves.appendChild(empty);
      return;
    }

    retired.forEach(beer => {
      graves.appendChild(makeGrave(beer));
    });

  } catch (error) {
    console.error("DeadBrewing Crypt:", error);

    soulCount.textContent = "THE CRYPT";
    graves.replaceChildren();

    const message = document.createElement("div");
    message.className = "empty-message";
    message.textContent =
      "UNABLE TO LOAD RETIRED BEERS.";

    graves.appendChild(message);
  }
}

loadCrypt();
</script>

</body>
</html>
