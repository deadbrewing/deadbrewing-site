
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Crypt | DeadBrewing</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  min-height: 100%;
  background: #080606;
  color: #ffe4b5;
  font-family: Georgia, serif;
}

.viewport {
  width: 100%;
}

.page {
  position: relative;
  width: min(100vw, 177.37vh, 1646px);
  aspect-ratio: 16 / 9;
  margin: 0 auto;

  background-image: url("deadbrewing-crypt-scene.png?v=1");
  background-size: 100% 100%;
  background-position: center;
  background-repeat: no-repeat;
}

/* Counter over the artwork's parchment plaque */
.soul-count {
  position: absolute;
  z-index: 5;

  left: 57.5%;
  top: 20.3%;
  width: 19%;
  height: 3.7%;

  display: flex;
  align-items: center;
  justify-content: center;

  background: #e6bd83;
  color: #211007;
  font-weight: bold;
  font-size: clamp(10px, 1.7vh, 19px);
  text-align: center;
  white-space: nowrap;
}

/*
  Scrollable area INSIDE the decorative frame.
  The whole tombstone moves, including its image.
*/
.graveyard {
  position: absolute;
  z-index: 3;

  left: 30%;
  top: 26%;
  width: 62%;
  height: 54%;

  overflow-y: auto;
  overflow-x: hidden;
  overscroll-behavior: contain;

  scrollbar-width: none;
}

.graveyard::-webkit-scrollbar {
  display: none;
}

.graves {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 1.5%;
  row-gap: 10px;
  padding: 0 1% 2%;
  align-content: start;
}

/* Each retired beer is one complete tombstone */
.grave {
  position: relative;
  display: block;
  width: 100%;
  aspect-ratio: 1 / 1.05;
  min-width: 0;

  background-image: url("deadbrewing-tombstone.png?v=1");
  background-size: 100% 100%;
  background-position: center;
  background-repeat: no-repeat;

  color: #ffe5b9;
  text-align: center;
  text-decoration: none;
  text-shadow: 2px 2px 3px #000;

  transition: filter 0.15s ease;
}

.grave:hover {
  filter: brightness(1.25);
}

/* Text positioned inside the blank stone */
.grave-info {
  position: absolute;
  left: 15%;
  top: 27%;
  width: 70%;
  height: 45%;

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 5%;
}

.beer-name {
  font-size: clamp(10px, 1.7vh, 19px);
  font-weight: bold;
  line-height: 1.1;
  overflow-wrap: anywhere;
}

.beer-stats {
  font-size: clamp(9px, 1.3vh, 15px);
}

.kicked-label {
  font-size: clamp(9px, 1.2vh, 14px);
}

.kicked-date {
  font-size: clamp(10px, 1.5vh, 17px);
  font-weight: bold;
}

/* Empty graveyard message */
.empty-message {
  padding: 12% 5%;
  grid-column: 1 / -1;

  color: #ffe4b5;
  text-align: center;
  font-weight: bold;
  font-size: clamp(12px, 2vh, 22px);
  text-shadow: 2px 2px 4px #000;
}

/* Invisible clickable area over original Back button */
.back {
  position: absolute;
  z-index: 5;
  left: 5%;
  bottom: 3%;
  width: 19%;
  height: 7%;
  display: block;
}

/* Mobile support */
@media (max-width: 700px) {
  .viewport {
    overflow-x: auto;
  }

  .page {
    min-width: 700px;
  }

  .beer-name {
    font-size: 12px;
  }

  .beer-stats,
  .kicked-label,
  .kicked-date {
    font-size: 10px;
  }

  .soul-count {
    font-size: 11px;
  }
}
</style>
</head>

<body>

<div class="viewport">
<main class="page" aria-label="DeadBrewing The Crypt">

  <div class="soul-count" id="soul-count">
    LOADING...
  </div>

  <section class="graveyard" aria-label="Retired beers">
    <div class="graves" id="graves"></div>
  </section>

  <a
    class="back"
    href="index.html"
    aria-label="Back to DeadBrewing homepage">
  </a>

</main>
</div>

<script>
const graves = document.getElementById("graves");
const soulCount = document.getElementById("soul-count");

/* Format the keg-kicked date */
function formatDate(value) {
  if (!value) return "DATE UNKNOWN";

  const date = new Date(value + "T12:00:00");

  if (Number.isNaN(date.getTime())) {
    return value;
  }

  return date.toLocaleDateString("en-CA", {
    year: "numeric",
    month: "short",
    day: "numeric"
  }).toUpperCase();
}

function addText(parent, className, value) {
  const element = document.createElement("div");
  element.className = className;
  element.textContent = value;
  parent.appendChild(element);
}

/* Create one complete, scrollable tombstone */
function makeGrave(beer) {
  const grave = document.createElement("a");
  grave.className = "grave";

  grave.href =
    "beer.html?id=" + encodeURIComponent(beer.id);

  grave.setAttribute(
    "aria-label",
    "View " + beer.name
  );

  const info = document.createElement("div");
  info.className = "grave-info";

  addText(info, "beer-name", beer.name || "UNKNOWN BEER");

  const abv = beer.abv != null
    ? beer.abv + "% ABV"
    : "— ABV";

  const ibu = beer.ibu != null
    ? beer.ibu + " IBU"
    : "— IBU";

  addText(info, "beer-stats", abv + " | " + ibu);
  addText(info, "kicked-label", "KEG KICKED");
  addText(info, "kicked-date", formatDate(beer.ripDate));

  grave.appendChild(info);

  return grave;
}

/* Fetch fresh beer data on every visit */
async function loadCrypt() {
  try {
    const response = await fetch(
      "beers.json?refresh=" + Date.now(),
      { cache: "no-store" }
    );

    if (!response.ok) {
      throw new Error("Unable to load beer information");
    }

    const data = await response.json();

    const retired = (data.beers || [])
      .filter(beer =>
        String(beer.status).trim().toLowerCase() === "retired"
      )
      .sort((a, b) =>
        (b.ripDate || "").localeCompare(a.ripDate || "")
      );

    const count = retired.length;

    soulCount.textContent =
      count + " SOUL" +
      (count === 1 ? "" : "S") +
      " LAID TO REST";

    graves.replaceChildren();

    if (count === 0) {
      const empty = document.createElement("div");
      empty.className = "empty-message";
      empty.textContent =
        "THE GRAVEYARD AWAITS ITS FIRST SOUL.";
      graves.appendChild(empty);
      return;
    }

    retired.forEach(beer => {
      graves.appendChild(makeGrave(beer));
    });

  } catch (error) {
    console.error("DeadBrewing Crypt:", error);
    soulCount.textContent = "THE CRYPT";

    graves.replaceChildren();

    const message = document.createElement("div");
    message.className = "empty-message";
    message.textContent =
      "UNABLE TO LOAD RETIRED BEERS.";

    graves.appendChild(message);
  }
}

loadCrypt();
</script>

</body>
</html>
