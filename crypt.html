
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>The Crypt | DeadBrewing</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  min-height: 100%;
  background: #080606;
  color: #ffe4b5;
  font-family: Georgia, serif;
}

.page {
  position: relative;
  width: min(100vw, 177.37vh, 1646px);
  aspect-ratio: 16 / 9;
  margin: 0 auto;

  background-image:
    url("deadbrewing-crypt-background.png?v=4");

  background-size: 100% 100%;
  background-position: center;
  background-repeat: no-repeat;
}

/* Live counter over the artwork's counter plaque */
.soul-count {
  position: absolute;
  z-index: 4;
  left: 57.5%;
  top: 20%;
  width: 20%;
  height: 4.2%;

  display: flex;
  align-items: center;
  justify-content: center;

  background: #e6bd83;
  color: #211007;
  font-weight: bold;
  font-size: clamp(10px, 1.8vh, 20px);
  text-align: center;
}

/* Scrolling region inside the artwork's graveyard frame */
.graveyard {
  position: absolute;
  z-index: 3;

  left: 31.2%;
  top: 25.5%;
  width: 60.5%;
  height: 57%;

  overflow-y: auto;
  overflow-x: hidden;

  /* Transparent so the artwork remains visible */
  background: transparent;

  scrollbar-width: thin;
  scrollbar-color: #d77723 transparent;
}

/*
  Six positions match the artwork's tombstones.
  Additional retired beers will scroll below them.
*/
.graves {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  column-gap: 2.2%;
  row-gap: 3%;

  padding: 0 1% 2%;
}

/* Invisible clickable tombstone areas */
.grave {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;

  min-width: 0;
  aspect-ratio: 1.12;

  padding: 14% 6% 12%;

  color: #ffe5b9;
  text-align: center;
  text-decoration: none;
  text-shadow: 2px 2px 3px #000;
}

/* Beer information over the blank stone */
.beer-name {
  font-size: clamp(10px, 1.8vh, 20px);
  font-weight: bold;
  line-height: 1.1;
  overflow-wrap: anywhere;
}

.beer-stats {
  margin-top: 5%;
  font-size: clamp(9px, 1.4vh, 15px);
}

.kicked-label {
  margin-top: 7%;
  font-size: clamp(9px, 1.3vh, 14px);
}

.kicked-date {
  margin-top: 2%;
  font-size: clamp(10px, 1.6vh, 18px);
  font-weight: bold;
}

/* Entire tombstone is clickable */
.grave:hover {
  filter: brightness(1.3);
}

/* Blank positions remain invisible */
.grave.empty {
  pointer-events: none;
}

/* When scrolling beyond the first six, create stone backgrounds */
.grave.extra {
  background:
    linear-gradient(145deg, #5d5449, #292824 55%, #141716);
  border: 3px ridge #8e795c;
  border-radius: 45% 45% 8px 8px / 22% 22% 8px 8px;
  box-shadow: inset 0 0 15px #080808;
}

/* Empty graveyard message */
.empty-message {
  position: absolute;
  z-index: 4;

  left: 35%;
  top: 45%;
  width: 55%;

  padding: 1%;
  background: rgba(5, 12, 16, 0.85);

  text-align: center;
  color: #ffe4b5;
  font-size: clamp(11px, 1.8vh, 20px);
  font-weight: bold;
  line-height: 1.4;
}

/* Invisible link over the artwork's existing Back button */
.back {
  position: absolute;
  z-index: 5;

  left: 5%;
  bottom: 3%;
  width: 19%;
  height: 7%;

  display: block;
  text-decoration: none;
}

/* Invisible link over the future voting banner */
.vote-banner {
  position: absolute;
  z-index: 5;

  left: 47%;
  bottom: 3%;
  width: 32%;
  height: 13%;

  display: block;
  cursor: pointer;
}

/* Mobile */
@media (max-width: 700px) {
  .viewport {
    overflow-x: auto;
  }

  .page {
    min-width: 700px;
  }

  .beer-name {
    font-size: 12px;
  }

  .beer-stats,
  .kicked-label,
  .kicked-date {
    font-size: 10px;
  }

  .soul-count {
    font-size: 11px;
  }
}
</style>
</head>

<body>

<div class="viewport">

<main class="page" aria-label="DeadBrewing The Crypt">

  <div class="soul-count" id="soul-count">
    0 SOULS LAID TO REST
  </div>

  <section class="graveyard" aria-label="Retired beers">
    <div class="graves" id="graves"></div>
  </section>

  <div class="empty-message" id="empty-message" hidden>
    THE GRAVEYARD AWAITS ITS FIRST SOUL.
    NO KEGS HAVE BEEN LAID TO REST.
  </div>

  <a
    class="back"
    href="index.html"
    aria-label="Back to DeadBrewing homepage">
  </a>

</main>

</div>

<script>
const graves = document.getElementById("graves");
const soulCount = document.getElementById("soul-count");
const emptyMessage = document.getElementById("empty-message");

function formatDate(value) {
  if (!value) return "DATE UNKNOWN";

  const date = new Date(value + "T12:00:00");

  if (Number.isNaN(date.getTime())) {
    return value;
  }

  return date.toLocaleDateString("en-CA", {
    year: "numeric",
    month: "short",
    day: "numeric"
  }).toUpperCase();
}

function addText(parent, className, value) {
  const element = document.createElement("div");
  element.className = className;
  element.textContent = value;
  parent.appendChild(element);
}

function makeGrave(beer, index) {
  const grave = document.createElement("a");

  grave.className = index >= 6
    ? "grave extra"
    : "grave";

  grave.href =
    "beer.html?id=" + encodeURIComponent(beer.id);

  grave.setAttribute(
    "aria-label",
    "View " + beer.name
  );

  addText(grave, "beer-name", beer.name || "UNKNOWN BEER");

  const abv = beer.abv != null
    ? beer.abv + "% ABV"
    : "— ABV";

  const ibu = beer.ibu != null
    ? beer.ibu + " IBU"
    : "— IBU";

  addText(grave, "beer-stats", abv + " | " + ibu);
  addText(grave, "kicked-label", "KEG KICKED");
  addText(grave, "kicked-date", formatDate(beer.ripDate));

  return grave;
}

fetch("beers.json?v=4")
  .then(response => {
    if (!response.ok) {
      throw new Error("Unable to load beer information");
    }

    return response.json();
  })
  .then(data => {
    const beers = Array.isArray(data.beers)
      ? data.beers
      : [];

    const retired = beers
      .filter(beer => beer.status === "retired")
      .sort((a, b) =>
        (b.ripDate || "").localeCompare(a.ripDate || "")
      );

    soulCount.textContent =
      retired.length + " SOUL" +
      (retired.length === 1 ? "" : "S") +
      " LAID TO REST";

    graves.replaceChildren();

    retired.forEach((beer, index) => {
      graves.appendChild(makeGrave(beer, index));
    });

    /*
      The first six tombstones are already in the
      background artwork. Empty slots stay blank.
    */
    for (let i = retired.length; i < 6; i++) {
      const empty = document.createElement("div");
      empty.className = "grave empty";
      graves.appendChild(empty);
    }

    emptyMessage.hidden = retired.length !== 0;
  })
  .catch(error => {
    emptyMessage.textContent = error.message;
    emptyMessage.hidden = false;
  });
</script>

</body>
</html>
