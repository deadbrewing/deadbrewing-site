
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Crypt | DeadBrewing</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  min-height: 100%;
  background: #080606;
  color: #ffe4b5;
  font-family: Georgia, serif;
}

.page {
  position: relative;
  width: min(100vw, 177.37vh, 1646px);
  aspect-ratio: 16 / 9;
  margin: 0 auto;
  background-image: url("deadbrewing-crypt-background.png?v=1");
  background-size: 100% 100%;
  background-position: center;
  background-repeat: no-repeat;
}

/* Live retired-beer count */
.soul-count {
  position: absolute;
  z-index: 3;
  left: 56%;
  top: 20.5%;
  width: 23%;
  height: 4.4%;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #e5bd82;
  color: #24120a;
  border: 2px solid #76502a;
  font-size: clamp(10px, 1.9vh, 21px);
  font-weight: bold;
  text-align: center;
}

/* Scrollable graveyard */
.graveyard {
  position: absolute;
  z-index: 2;
  left: 29%;
  top: 26%;
  width: 64%;
  height: 57%;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 1.2%;
  background: rgba(5, 14, 19, 0.94);
  border: 2px solid #76502a;
  scrollbar-color: #d77b28 #17120e;
  scrollbar-width: thin;
}

/* Three tombstones per row */
.graves {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 2%;
  row-gap: 14px;
  align-content: start;
}

/* Individual tombstone */
.grave {
  position: relative;
  min-width: 0;
  min-height: 170px;
  aspect-ratio: 0.95;
  padding: 12% 5% 6%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-between;
  text-align: center;
  text-decoration: none;
  color: #ffe3b1;

  background:
    linear-gradient(145deg, #5c554b, #292a28 50%, #141918);
  border: 3px ridge #8e795c;
  border-radius: 48% 48% 8px 8px / 22% 22% 8px 8px;
  box-shadow:
    inset 0 0 16px #080808,
    0 5px 8px #000;
  transition: transform 0.15s, border-color 0.15s;
}

.grave:hover {
  transform: translateY(-3px);
  border-color: #ff9a3c;
}

.rip {
  font-size: clamp(14px, 2.6vh, 28px);
  font-weight: bold;
  text-shadow: 2px 2px 3px #000;
}

.beer-name {
  font-size: clamp(11px, 1.9vh, 21px);
  font-weight: bold;
  line-height: 1.1;
  overflow-wrap: anywhere;
  text-shadow: 2px 2px 3px #000;
}

.beer-stats {
  font-size: clamp(10px, 1.4vh, 15px);
}

.kicked-label {
  font-size: clamp(9px, 1.3vh, 14px);
}

.kicked-date {
  font-size: clamp(10px, 1.7vh, 18px);
  font-weight: bold;
}

.view-beer {
  width: 90%;
  padding: 4px;
  background: linear-gradient(#f4a34b, #8c390d);
  border: 2px ridge #e2a55c;
  color: #190c05;
  font-size: clamp(10px, 1.4vh, 16px);
  font-weight: bold;
  text-shadow: 0 1px #ffd9a0;
}

.grave:hover .view-beer {
  background: #ffc06e;
}

/* Message when no beers have retired */
.empty-message {
  grid-column: 1 / -1;
  padding: 12%;
  text-align: center;
  color: #ffe3b1;
  font-size: clamp(13px, 2vh, 23px);
  line-height: 1.5;
}

/* Homepage link */
.back {
  position: absolute;
  z-index: 4;
  left: 5%;
  bottom: 4%;
  width: 18%;
  height: 5%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #ffe3b1;
  font-size: clamp(10px, 1.7vh, 18px);
  font-weight: bold;
  text-decoration: none;
  text-shadow: 2px 2px 3px #000;
}

.back:hover {
  color: #ff9a3c;
}

/* Mobile: allow horizontal scrolling */
@media (max-width: 700px) {
  .viewport {
    overflow-x: auto;
  }

  .page {
    min-width: 700px;
  }

  .graveyard {
    padding: 10px;
  }

  .grave {
    min-height: 135px;
    padding: 12px 5px 8px;
  }

  .rip {
    font-size: 18px;
  }

  .beer-name {
    font-size: 13px;
  }

  .beer-stats,
  .kicked-date {
    font-size: 11px;
  }

  .kicked-label,
  .view-beer {
    font-size: 10px;
  }

  .soul-count {
    font-size: 11px;
  }

  .back {
    font-size: 11px;
  }
}
</style>
</head>

<body>

<div class="viewport">
<main class="page" aria-label="DeadBrewing The Crypt">

  <div class="soul-count" id="soul-count">
    THE CRYPT
  </div>

  <section class="graveyard" aria-label="Retired beers">
    <div class="graves" id="graves">
      <div class="empty-message">
        Summoning the dead...
      </div>
    </div>
  </section>

  <a class="back" href="index.html">
    ← Back to DeadBrewing
  </a>

</main>
</div>

<script>
const graves = document.getElementById("graves");
const soulCount = document.getElementById("soul-count");

function formatDate(value) {
  if (!value) return "DATE UNKNOWN";

  const date = new Date(value + "T12:00:00");

  if (Number.isNaN(date.getTime())) {
    return value;
  }

  return date.toLocaleDateString("en-CA", {
    year: "numeric",
    month: "short",
    day: "numeric"
  }).toUpperCase();
}

function addText(parent, className, text) {
  const element = document.createElement("div");
  element.className = className;
  element.textContent = text;
  parent.appendChild(element);
}

function renderGrave(beer) {
  const grave = document.createElement("a");
  grave.className = "grave";
  grave.href = "beer.html?id=" + encodeURIComponent(beer.id);

  addText(grave, "rip", "R.I.P.");
  addText(grave, "beer-name", beer.name || "UNKNOWN BEER");

  const abv = beer.abv != null ? beer.abv + "% ABV" : "— ABV";
  const ibu = beer.ibu != null ? beer.ibu + " IBU" : "— IBU";

  addText(grave, "beer-stats", abv + " | " + ibu);
  addText(grave, "kicked-label", "KEG KICKED");
  addText(grave, "kicked-date", formatDate(beer.ripDate));
  addText(grave, "view-beer", "VIEW BEER");

  graves.appendChild(grave);
}

fetch("beers.json?v=1")
  .then(response => {
    if (!response.ok) {
      throw new Error("Unable to load beer information");
    }
    return response.json();
  })
  .then(data => {
    const beers = Array.isArray(data.beers) ? data.beers : [];

    const retired = beers
      .filter(beer => beer.status === "retired")
      .sort((a, b) =>
        (b.ripDate || "").localeCompare(a.ripDate || "")
      );

    soulCount.textContent =
      retired.length + " SOUL" +
      (retired.length === 1 ? "" : "S") +
      " LAID TO REST";

    graves.replaceChildren();

    if (retired.length === 0) {
      const message = document.createElement("div");
      message.className = "empty-message";
      message.textContent =
        "THE GRAVEYARD AWAITS ITS FIRST SOUL. " +
        "NO KEGS HAVE BEEN LAID TO REST.";
      graves.appendChild(message);
      return;
    }

    retired.forEach(renderGrave);
  })
  .catch(error => {
    graves.replaceChildren();

    const message = document.createElement("div");
    message.className = "empty-message";
    message.textContent = error.message;
    graves.appendChild(message);
  });
</script>

</body>
</html>
