
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DeadBrewing | Est. 2018</title>

<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #080606;
  font-family: Georgia, serif;
  color: #ffe5a5;
}

body {
  display: flex;
  align-items: center;
  justify-content: center;
}

.stage {
  position: relative;
  width: min(100vw, 177.586dvh);
  aspect-ratio: 1648 / 928;
  flex-shrink: 0;
  background:
    url("deadbrewing-home-blank.png")
    center / 100% 100% no-repeat;
}

/* NAVIGATION */

.nav-link {
  position: absolute;
  top: 19%;
  height: 6.5%;
  z-index: 10;
  border-radius: 8px;
}

.nav-link:hover,
.nav-link:focus-visible {
  background: rgba(255, 130, 25, .16);
  box-shadow: inset 0 0 15px #ff8c34;
}

.journal { left: 23.5%; width: 19%; }
.crypt   { left: 46%; width: 14%; }
.vip     { left: 61%; width: 9%; }
.contact { left: 71%; width: 13%; }

/* TAP NAMEPLATES */

.tap {
  position: absolute;
  top: 37%;
  width: 10%;
  height: 54%;
}

.tap-1 { left: 20.8%; }
.tap-2 { left: 32.3%; }
.tap-3 { left: 43.8%; }
.tap-4 { left: 55.3%; }

.tap-label {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 21%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 2%;
  color: #ffe2a0;
  text-shadow: 1px 2px 3px #000;
  text-decoration: none;
}

.tap-label strong {
  font-size: clamp(6px, 1.25vw, 20px);
  line-height: 1.12;
}

.tap-label small {
  margin-top: 4%;
  font-size: clamp(5px, .95vw, 15px);
}

.tap.empty .tap-label {
  color: #bba98a;
}

/* CLASSIC DB GLASSES */

.glass-link {
  position: absolute;
  left: 12%;
  top: 53%;
  width: 76%;
  height: 47%;
  display: block;
  text-decoration: none;
  transition: transform .2s, filter .2s;
  filter: drop-shadow(0 3px 4px #000);
}

.glass-link:hover,
.glass-link:focus-visible {
  transform: translateY(-3%);
  filter: drop-shadow(0 0 10px #ff9b36);
}

.glass {
  position: relative;
  width: 100%;
  height: 100%;
}

/* Beer colour behind the transparent glass */
.liquid {
  position: absolute;
  left: 15%;
  top: 15%;
  width: 70%;
  height: 77%;
  clip-path: polygon(
    0% 0%,
    100% 0%,
    89% 100%,
    11% 100%
  );
  background: var(--beer-colour);
  box-shadow: inset 0 0 15px #000;
}

/* Adds shading without changing SRM */
.liquid::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(
    90deg,
    rgba(255,255,255,.35),
    transparent 22%,
    transparent 68%,
    rgba(0,0,0,.48)
  );
}

/* Foam at the top of the beer */
.foam {
  position: absolute;
  left: 15%;
  top: 12%;
  width: 70%;
  height: 9%;
  background: #fff0d7;
  border-radius: 48% 52% 35% 40%;
  box-shadow: 0 2px 5px #d8b88d;
}

/* Actual Classic DB glass artwork */
.glass-image {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: fill;
  z-index: 2;
  pointer-events: none;
}

/* Optional glass bubbles */
.bubbles {
  position: absolute;
  left: 23%;
  top: 26%;
  width: 54%;
  height: 57%;
  opacity: .5;
  background-image:
    radial-gradient(circle, #fff6d7 1px, transparent 2px),
    radial-gradient(circle, #fff6d7 1px, transparent 2px);
  background-size: 17px 27px, 23px 32px;
  background-position: 0 0, 8px 13px;
  z-index: 1;
  pointer-events: none;
}

/* Keep the brewing data blank for now */
.brewing-values {
  position: absolute;
  left: 81%;
  top: 46%;
  width: 11%;
  height: 22%;
  pointer-events: none;
}

.brewing-values span {
  display: block;
  height: 14.285%;
  text-align: right;
  font-size: clamp(6px, .8vw, 12px);
}

/* Keep a small footer outside the artwork hidden
   so the homepage never gains vertical scrolling. */

</style>
</head>

<body>

<main class="stage" aria-label="DeadBrewing homepage">

  <nav aria-label="Main navigation">
    <a class="nav-link journal"
       href="journal.html"
       aria-label="Brew Journal"></a>

    <a class="nav-link crypt"
       href="crypt.html"
       aria-label="The Crypt"></a>

    <a class="nav-link vip"
       href="vip.html"
       aria-label="VIP"></a>

    <a class="nav-link contact"
       href="contact.html"
       aria-label="Contact"></a>
  </nav>

  <section id="taps"
           aria-label="Beers currently on tap">
  </section>

  <div class="brewing-values"
       id="brewing-values"
       aria-label="Brewing Now information">
  </div>

</main>

<script>
"use strict";

const escapeHTML = value =>
  String(value ?? "").replace(
    /[&<>"']/g,
    char => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    })[char]
  );

/*
  Approximate SRM-to-RGB conversion.

  Uses a standard-style empirical colour curve.
  The display is illustrative rather than
  an exact physical colour measurement.
*/
function srmToRGB(srm) {
  const value = Math.max(0.1, Number(srm));

  if (!Number.isFinite(value)) {
    return null;
  }

  const r = Math.round(
    Math.min(255, 255 * Math.pow(value, -0.18))
  );

  const g = Math.round(
    Math.min(255, 245 * Math.pow(value, -0.38))
  );

  const b = Math.round(
    Math.min(255, 200 * Math.pow(value, -0.75))
  );

  return `rgb(${r}, ${g}, ${b})`;
}

function getBeerColour(beer) {
  if (
    beer.srm !== undefined &&
    beer.srm !== null &&
    beer.srm !== ""
  ) {
    const calculated = srmToRGB(beer.srm);

    if (calculated) {
      return calculated;
    }
  }

  const fallback = String(beer.colour || "");

  if (/^#[0-9a-f]{6}$/i.test(fallback)) {
    return fallback;
  }

  return "#dba632";
}

function makeGlass(beer) {
  const colour = getBeerColour(beer);

  return `
    <div class="glass"
         style="--beer-colour:${colour}">

      <div class="liquid"></div>
      <div class="bubbles"></div>
      <div class="foam"></div>

      <img
        class="glass-image"
        src="deadbrewing-classic-glass.png"
        alt=""
        draggable="false"
      >

    </div>
  `;
}

function renderTap(number, beer) {
  if (!beer) {
    return `
      <div class="tap tap-${number} empty"
           aria-label="Tap ${number} empty">

        <div class="tap-label">
          <strong>TAP EMPTY</strong>
        </div>

      </div>
    `;
  }

  const name = escapeHTML(beer.name);
  const abv = Number(beer.abv);
  const abvText = Number.isFinite(abv)
    ? `${abv}% ABV`
    : "";

  const url =
    `beer.html?id=${encodeURIComponent(beer.id)}`;

  return `
    <div class="tap tap-${number}">

      <a class="tap-label"
         href="${url}"
         aria-label="View ${name}">

        <strong>${name}</strong>
        <small>${escapeHTML(abvText)}</small>

      </a>

      <a class="glass-link"
         href="${url}"
         aria-label="View ${name}">

        ${makeGlass(beer)}

      </a>

    </div>
  `;
}

async function loadTaps() {
  const container = document.getElementById("taps");

  try {
    const response = await fetch(
      "beers.json",
      { cache: "no-store" }
    );

    if (!response.ok) {
      throw new Error("Could not load beers.json");
    }

    const data = await response.json();

    const beers = Array.isArray(data.beers)
      ? data.beers
      : [];

    const active = beers.filter(
      beer => beer.status === "on-tap"
    );

    const results = [];

    for (let number = 1; number <= 4; number++) {
      const beer = active.find(
        item => Number(item.tap) === number
      );

      results.push(renderTap(number, beer));
    }

    container.innerHTML = results.join("");

  } catch (error) {
    console.error(error);

    container.innerHTML =
      '<p style="position:absolute;left:30%;top:40%">' +
      'Beer menu temporarily unavailable.' +
      '</p>';
  }
}

loadTaps();
</script>

</body>
</html>
