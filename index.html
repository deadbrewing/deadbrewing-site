
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DeadBrewing | Est. 2018</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #080606;
  color: #fff0d7;
  font-family: Georgia, serif;
}

.viewport {
  width: 100%;
  overflow-x: auto;
}

.stage {
  position: relative;
  width: min(100%, 1648px);
  aspect-ratio: 1648 / 928;
  margin: auto;
  background: url("deadbrewing-home-blank.png")
    center / 100% 100% no-repeat;
  overflow: hidden;
}

/* Four navigation buttons in the artwork */
.top-nav {
  position: absolute;
  left: 24%;
  top: 17%;
  width: 43%;
  height: 7%;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 1%;
  z-index: 10;
}

.top-nav a {
  display: block;
  border-radius: 6px;
}

.top-nav a:hover,
.top-nav a:focus-visible {
  background: rgba(255, 116, 30, .16);
  box-shadow: inset 0 0 14px #ff8739;
}

/* The four fixed tap positions */
.taps {
  position: absolute;
  left: 20%;
  top: 36%;
  width: 48%;
  height: 49%;
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 1%;
  z-index: 4;
}

.tap {
  position: relative;
  min-width: 0;
  height: 100%;
  text-decoration: none;
  color: #ffe3a0;
  display: block;
}

.tap-name {
  position: absolute;
  top: 0;
  left: 2%;
  width: 96%;
  height: 17%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 2%;
  text-shadow: 0 2px 3px #000;
}

.tap-name strong {
  font-size: clamp(7px, .95vw, 15px);
  line-height: 1.05;
}

.tap-name small {
  margin-top: 3px;
  font-size: clamp(6px, .8vw, 12px);
}

.tap.empty .tap-name {
  color: #a99980;
}

.glass-holder {
  position: absolute;
  top: 32%;
  left: 14%;
  width: 72%;
  height: 66%;
  transition: transform .2s, filter .2s;
  filter: drop-shadow(0 5px 5px #000);
}

.tap:not(.empty):hover .glass-holder,
.tap:not(.empty):focus-visible .glass-holder {
  transform: translateY(-4px);
  filter: drop-shadow(0 0 12px #ff8d30);
}

.beer-glass {
  width: 100%;
  height: 100%;
  display: block;
  overflow: visible;
}

/* Glass rendering */
.glass-outline {
  fill: rgba(230, 245, 255, .08);
  stroke: rgba(255, 244, 218, .8);
  stroke-width: 2.2;
}

.glass-highlight {
  fill: rgba(255, 255, 255, .22);
}

.glass-foam {
  fill: #fff0d9;
  stroke: #fff9ed;
  stroke-width: 1.4;
}

.glass-base {
  fill: rgba(228, 238, 245, .32);
  stroke: rgba(255, 255, 255, .75);
  stroke-width: 2;
}

.glass-logo {
  fill: #e8b84d;
  stroke: #3d260b;
  stroke-width: .6;
}

/* Brewing Now live-data values.
   Left blank until we connect the brewing data. */
.brewing-values {
  position: absolute;
  left: 80%;
  top: 36%;
  width: 14%;
  height: 27%;
  pointer-events: none;
}

.brewing-values .value {
  display: block;
  height: 14.28%;
  text-align: right;
  font-size: clamp(7px, .95vw, 14px);
  color: #f2d49d;
  text-shadow: 0 1px 3px #000;
}

.note {
  text-align: center;
  padding: 12px 20px;
  font: 13px Arial, sans-serif;
  color: #c9a98a;
}

@media (max-width: 700px) {
  .stage {
    width: 700px;
  }

  .tap-name strong {
    font-size: 8px;
  }

  .tap-name small {
    font-size: 7px;
  }

  .brewing-values .value {
    font-size: 8px;
  }
}
</style>
</head>

<body>

<div class="viewport">
  <main class="stage" aria-label="DeadBrewing homepage">

    <nav class="top-nav" aria-label="Main navigation">
      <a href="journal.html" aria-label="Brew Journal"></a>
      <a href="crypt.html" aria-label="The Crypt"></a>
      <a href="vip.html" aria-label="VIP"></a>
      <a href="contact.html" aria-label="Contact"></a>
    </nav>

    <div id="taps" class="taps"
         aria-label="DeadBrewing beers on tap"></div>

    <div class="brewing-values" id="brewing-values"
         aria-label="Brewing Now data"></div>

  </main>
</div>

<p class="note">
  Select a beer to see its details.
  Bitcoin donation QR is decorative, not a payment address.
</p>

<script>
"use strict";

const esc = value => String(value ?? "").replace(
  /[&<>"']/g,
  char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[char]
);

/*
  Convert SRM to approximate screen RGB.
  Falls back to the beer's existing colour field.
*/
function srmToColour(srm) {
  const value = Number(srm);

  if (!Number.isFinite(value) || value < 0) {
    return null;
  }

  const channels = [
    Math.round(255 * Math.min(1, 0.975 ** value)),
    Math.round(245 * Math.min(1, 0.88 ** value)),
    Math.round(220 * Math.min(1, 0.70 ** value))
  ];

  return "#" + channels.map(
    channel => Math.max(0, channel)
      .toString(16).padStart(2, "0")
  ).join("");
}

function beerColour(beer) {
  if (beer.srm !== undefined &&
      beer.srm !== null &&
      beer.srm !== "") {
    return srmToColour(beer.srm) || "#d6a13a";
  }

  const fallback = String(beer.colour || "");

  return /^#[0-9a-f]{6}$/i.test(fallback)
    ? fallback
    : "#d6a13a";
}

/*
  Dynamic beer glass.

  The beer fill is a separate SVG layer.
  This first version uses an SVG glass so
  the SRM colour is guaranteed to be visible.

  We can replace its outline and logo with
  the Classic DB PNG once transparency is verified.
*/
function glass(beer) {
  const id = "tap" + Number(beer.tap);
  const colour = beerColour(beer);

  return `
    <svg class="beer-glass"
         viewBox="0 0 120 220"
         role="img"
         aria-label="Glass of ${esc(beer.name)}">

      <defs>
        <clipPath id="clip-${id}">
          <path d="
            M19 14
            L101 14
            Q99 95 89 176
            Q88 190 76 192
            L44 192
            Q32 190 31 176
            Q21 95 19 14 Z
          "/>
        </clipPath>

        <linearGradient id="beer-${id}"
                        x1="0" x2="1">
          <stop offset="0"
                stop-color="#fff"
                stop-opacity=".25"/>
          <stop offset=".18"
                stop-color="${colour}"/>
          <stop offset=".72"
                stop-color="${colour}"/>
          <stop offset="1"
                stop-color="#170b05"
                stop-opacity=".8"/>
        </linearGradient>

        <linearGradient id="glass-shine-${id}"
                        x1="0" x2="1">
          <stop offset="0"
                stop-color="white"
                stop-opacity=".65"/>
          <stop offset=".22"
                stop-color="white"
                stop-opacity="0"/>
          <stop offset=".83"
                stop-color="white"
                stop-opacity=".12"/>
          <stop offset="1"
                stop-color="white"
                stop-opacity=".5"/>
        </linearGradient>
      </defs>

      <!-- Beer liquid -->
      <g clip-path="url(#clip-${id})">
        <rect x="16" y="38"
              width="88" height="155"
              fill="url(#beer-${id})"/>

        <ellipse cx="60" cy="39"
                 rx="41" ry="6"
                 fill="${colour}"/>

        <!-- Bubbles -->
        <g fill="#fff5d1" opacity=".45">
          <circle cx="39" cy="102" r="1.5"/>
          <circle cx="74" cy="137" r="1.2"/>
          <circle cx="49" cy="159" r="1"/>
          <circle cx="83" cy="89" r="1.3"/>
          <circle cx="63" cy="120" r="1"/>
          <circle cx="42" cy="174" r="1.1"/>
        </g>
      </g>

      <!-- Foam -->
      <path class="glass-foam" d="
        M20 38
        Q16 26 27 22
        Q28 10 41 14
        Q51 4 62 13
        Q75 5 83 16
        Q101 12 101 29
        L99 43
        Q60 39 21 43 Z
      "/>

      <!-- Glass outline -->
      <path class="glass-outline" d="
        M19 14
        L101 14
        Q99 95 89 176
        Q88 190 76 192
        L44 192
        Q32 190 31 176
        Q21 95 19 14 Z
      "/>

      <!-- Glass reflections -->
      <path d="
        M19 14
        L101 14
        Q99 95 89 176
        Q88 190 76 192
        L44 192
        Q32 190 31 176
        Q21 95 19 14 Z
      " fill="url(#glass-shine-${id})"
        opacity=".45"/>

      <path class="glass-highlight"
            d="M27 34 Q25 95 37 164
               L42 167 Q32 92 33 34 Z"/>

      <!-- Temporary DB logo -->
      <g text-anchor="middle">
        <text x="60" y="109"
              font-size="25"
              fill="#e8c67b"
              stroke="#3d260b"
              stroke-width=".8">☠</text>
        <text x="60" y="133"
              font-size="20"
              font-weight="bold"
              font-family="Georgia,serif"
              class="glass-logo">DB</text>
      </g>

      <!-- Heavy glass base -->
      <path class="glass-base"
            d="M33 180
               Q35 194 45 197
               L75 197
               Q85 194 87 180
               L86 201
               Q60 207 34 201 Z"/>

      <ellipse cx="60" cy="202"
               rx="27" ry="4"
               fill="rgba(255,255,255,.3)"
               stroke="rgba(255,255,255,.7)"
               stroke-width="1.5"/>
    </svg>
  `;
}

function renderTap(tapNumber, beer) {
  if (!beer) {
    return `
      <div class="tap empty"
           aria-label="Tap ${tapNumber} empty">
        <span class="tap-name">
          <strong>TAP EMPTY</strong>
        </span>
      </div>
    `;
  }

  const name = esc(beer.name);
  const abv = Number(beer.abv);

  const abvLabel = Number.isFinite(abv)
    ? abv + "% ABV"
    : "";

  return `
    <a class="tap"
       href="beer.html?id=${encodeURIComponent(beer.id)}"
       aria-label="View ${name}">

      <span class="tap-name">
        <strong>${name}</strong>
        <small>${esc(abvLabel)}</small>
      </span>

      <span class="glass-holder">
        ${glass(beer)}
      </span>
    </a>
  `;
}

async function loadBeers() {
  const container = document.getElementById("taps");

  try {
    const response = await fetch(
      "beers.json",
      { cache: "no-store" }
    );

    if (!response.ok) {
      throw new Error("Unable to load beers.json");
    }

    const data = await response.json();
    const beers = Array.isArray(data.beers)
      ? data.beers
      : [];

    const activeBeers = beers.filter(
      beer => beer.status === "on-tap"
    );

    const html = [];

    for (let tapNumber = 1; tapNumber <= 4; tapNumber++) {
      const beer = activeBeers.find(
        item => Number(item.tap) === tapNumber
      );

      html.push(renderTap(tapNumber, beer));
    }

    container.innerHTML = html.join("");

  } catch (error) {
    console.error("DeadBrewing tap error:", error);

    container.innerHTML =
      "<p>Beer menu temporarily unavailable.</p>";
  }
}

loadBeers();
</script>

</body>
</html>
