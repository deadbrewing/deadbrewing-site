
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brew Journal | DeadBrewing</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  min-height: 100%;
  background: #080604;
  font-family: Georgia, serif;
}

.journal {
  position: relative;
  width: 100%;
  aspect-ratio: 1792 / 850;
  background-image: url("deadbrewing-journal-background.png");
  background-size: 100% 100%;
  background-repeat: no-repeat;
}

/* RECIPE CARDS */

.recipe {
  position: absolute;
  width: 27.1%;
  height: 28%;
  display: flex;
  align-items: center;
  padding: 1.2%;
  color: #351604;
  text-decoration: none;
  overflow: hidden;
}

.recipe img {
  width: 33%;
  height: 90%;
  object-fit: contain;
  flex-shrink: 0;
}

.recipe-info {
  flex: 1;
  padding-left: 3%;
}

.recipe h2 {
  font-size: clamp(12px, 1.65vw, 30px);
  line-height: 1.08;
  margin: 0 0 7px;
}

.recipe p {
  font-size: clamp(9px, 0.9vw, 16px);
  margin: 0 0 12px;
}

.recipe strong {
  font-size: clamp(9px, 0.9vw, 16px);
}

.recipe:hover {
  background: rgba(255, 225, 150, 0.13);
}

/* INVISIBLE NAVIGATION BUTTONS */

.hitbox {
  position: absolute;
  display: block;
  padding: 0;
  margin: 0;
  border: none;
  background: transparent;
  color: transparent;
  font-size: 0;
  cursor: pointer;
  z-index: 5;
}

.hitbox:hover {
  background: rgba(255, 215, 100, 0.12);
}

.hitbox:focus-visible {
  outline: 2px solid #ffd16a;
}

/* NAVIGATION POSITIONS */

.previous {
  left: 52.0%;
  top: 82.2%;
  width: 10.0%;
  height: 6.5%;
}

.page1 {
  left: 63.4%;
  top: 82.2%;
  width: 3.8%;
  height: 6.5%;
}

.page2 {
  left: 67.4%;
  top: 82.2%;
  width: 3.8%;
  height: 6.5%;
}

.page3 {
  left: 71.4%;
  top: 82.2%;
  width: 3.8%;
  height: 6.5%;
}

.next {
  left: 77.0%;
  top: 82.2%;
  width: 10.0%;
  height: 6.5%;
}

/* ACTIVE PAGE INDICATOR */

.page-indicator {
  position: absolute;
  top: 82.2%;
  width: 3.8%;
  height: 6.5%;
  border: 2px solid rgba(255, 205, 75, 0.85);
  border-radius: 5px;
  background: rgba(190, 12, 0, 0.28);
  pointer-events: none;
  z-index: 4;
  transition: left 0.15s ease;
}

@media (max-width: 700px) {
  .journal {
    min-width: 900px;
  }

  body {
    overflow-x: auto;
  }
}
</style>
</head>

<body>

<main class="journal" id="journal">

  <div id="recipes"></div>

  <div class="page-indicator" id="pageIndicator"></div>

  <button
    class="hitbox previous"
    aria-label="Previous page"
    onclick="changePage(-1)">
  </button>

  <button
    class="hitbox page1"
    aria-label="Page 1"
    onclick="goToPage(1)">
  </button>

  <button
    class="hitbox page2"
    aria-label="Page 2"
    onclick="goToPage(2)">
  </button>

  <button
    class="hitbox page3"
    aria-label="Page 3"
    onclick="goToPage(3)">
  </button>

  <button
    class="hitbox next"
    aria-label="Next page"
    onclick="changePage(1)">
  </button>

</main>

<script>
const PAGE_SIZE = 4;
const TOTAL_PAGES = 3;

let currentPage = 1;
let allRecipes = [];

const GLASSES = {
  gold: "deadbrewing-glass-gold.png",
  red: "deadbrewing-glass-red.png",
  brown: "deadbrewing-glass-brown.png",
  stout: "deadbrewing-glass-stout.png"
};

function chooseGlass(recipe) {
  const text = (
    (recipe.name || "") + " " +
    (recipe.style || "")
  ).toLowerCase();

  if (/stout|porter|imperial dark/.test(text)) {
    return GLASSES.stout;
  }

  if (/red|amber|irish red/.test(text)) {
    return GLASSES.red;
  }

  if (/brown|dunkel|dark lager/.test(text)) {
    return GLASSES.brown;
  }

  return GLASSES.gold;
}

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[char]);
}

function renderPage() {
  const container = document.getElementById("recipes");
  container.innerHTML = "";

  const start = (currentPage - 1) * PAGE_SIZE;
  const visible = allRecipes.slice(start, start + PAGE_SIZE);

  visible.forEach((recipe, index) => {
    const card = document.createElement("a");

    card.className = "recipe";

    card.style.left =
      index % 2 === 0 ? "42.1%" : "70.5%";

    card.style.top =
      index < 2 ? "20.5%" : "50.5%";

    card.href =
      "recipe.html?id=" +
      encodeURIComponent(recipe.id || "");

    card.innerHTML = `
      <img src="${chooseGlass(recipe)}"
           alt=""
           onerror="this.style.display='none'">

      <div class="recipe-info">
        <h2>${escapeHTML(recipe.name)}</h2>
        <p>${escapeHTML(recipe.style)}</p>
        <strong>OPEN RECIPE →</strong>
      </div>
    `;

    container.appendChild(card);
  });

  // Move the active-page highlight to the selected number.
  const positions = {
    1: "63.4%",
    2: "67.4%",
    3: "71.4%"
  };

  document.getElementById("pageIndicator").style.left =
    positions[currentPage];

  document.querySelectorAll(".page1, .page2, .page3")
    .forEach((button, index) => {
      const active = index + 1 === currentPage;
      button.setAttribute("aria-current", active ? "page" : "false");
    });
}

function goToPage(page) {
  currentPage = Math.max(
    1,
    Math.min(TOTAL_PAGES, page)
  );

  renderPage();
}

function changePage(direction) {
  goToPage(currentPage + direction);
}

async function loadRecipes() {
  try {
    const response = await fetch("journal.json", {
      cache: "no-store"
    });

    if (!response.ok) {
      throw new Error("Could not load journal.json");
    }

    const data = await response.json();

    const batches = Array.isArray(data.batches)
      ? data.batches : [];

    const recipes = Array.isArray(data.recipes)
      ? data.recipes : [];

    const combined = [...batches, ...recipes];

    const seen = new Set();

    allRecipes = combined.filter(recipe => {
      const key = recipe.id || recipe.name;

      if (!key || seen.has(key)) {
        return false;
      }

      seen.add(key);
      return true;
    }).slice(0, 12);

    renderPage();

  } catch (error) {
    console.error(error);

    document.getElementById("recipes").innerHTML =
      '<p style="position:absolute;left:45%;top:25%;color:#300">' +
      'Unable to load recipes.</p>';
  }
}

loadRecipes();
</script>

</body>
</html>
