
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DeadBrewing | Brew Journal</title>

<style>
* {
  box-sizing: border-box;
}

:root {
  --gold: #f0c77c;
  --ink: #321a0e;
}

html, body {
  margin: 0;
  min-height: 100%;
  background: #080606;
  font-family: Georgia, "Times New Roman", serif;
}

/* Full-screen journal artwork */
.journal {
  position: relative;
  width: 100%;
  height: 100vh;
  min-height: 650px;
  overflow: hidden;

  background-image: url("deadbrewing-journal-background.png");
  background-position: center;
  background-repeat: no-repeat;
  background-size: 100% 100%;
}

/* Return to brewery */
.home {
  position: absolute;
  top: 2.4%;
  left: 1.2%;
  z-index: 10;

  padding: 11px 16px;
  color: var(--gold);
  background: #160c09ed;
  border: 1px solid #a77643;
  border-radius: 4px;

  font-size: 13px;
  letter-spacing: 2px;
  text-decoration: none;
  text-transform: uppercase;
}

.home:hover {
  background: #472217;
}

/*
  Recipe cards align with the four parchment
  panels already painted into the artwork.

  Coordinates are percentages of the artwork.
*/
.recipe-area {
  position: absolute;
  left: 42.2%;
  top: 17.6%;
  width: 55.8%;
  height: 67.5%;

  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-template-rows: 1fr 1fr;

  column-gap: 2.6%;
  row-gap: 3.6%;
}

.recipe-card {
  display: flex;
  align-items: center;
  gap: 3%;
  padding: 4%;

  color: var(--ink);
  text-decoration: none;
  border-radius: 8px;

  background: transparent;
  transition:
    transform .18s ease,
    filter .18s ease;
}

.recipe-card:hover {
  transform: scale(1.025);
  filter: brightness(1.12);
}

.recipe-card:focus-visible {
  outline: 3px solid #e9b45b;
  outline-offset: -4px;
}

.recipe-card img {
  width: 43%;
  height: 88%;
  object-fit: contain;
  flex-shrink: 0;

  filter: drop-shadow(2px 5px 4px #43200a70);
}

.recipe-info {
  flex: 1;
  min-width: 0;
}

.recipe-info h2 {
  margin: 0 0 10px;

  font-size: clamp(15px, 1.65vw, 30px);
  line-height: 1.08;
  color: #32170b;

  text-shadow: 0 1px 1px #ffe4b8;
}

.recipe-info p {
  margin: 0 0 14px;
  font-size: clamp(10px, .85vw, 15px);
  line-height: 1.25;
  color: #57301b;
}

.open-recipe {
  font-size: clamp(10px, .85vw, 15px);
  font-weight: bold;
  letter-spacing: .6px;
  color: #3d1c0d;
  text-transform: uppercase;
}

/* Empty slots show the original parchment */
.empty-card {
  pointer-events: none;
}

/* Functional navigation */
.pagination {
  position: absolute;
  left: 53%;
  top: 87.2%;
  width: 38%;
  height: 7%;

  display: flex;
  align-items: center;
  justify-content: center;
  gap: 3%;
}

.pagination button {
  font-family: Georgia, serif;
  font-size: clamp(12px, 1vw, 18px);
  font-weight: bold;

  color: #eac486;
  background: #2b130cf0;
  border: 1px solid #a86a31;
  border-radius: 4px;

  padding: 9px 14px;
  cursor: pointer;
  box-shadow: 0 2px 7px #0009;
}

.pagination button:hover:not(:disabled) {
  background: #64301b;
}

.pagination button:disabled {
  opacity: .35;
  cursor: default;
}

.page-numbers {
  display: flex;
  align-items: center;
  gap: 5px;
}

.page-number {
  min-width: 36px;
  text-align: center;
}

.pagination .page-number.active {
  color: #301507;
  background: #d8a25c;
  border-color: #efc785;
}

.error {
  grid-column: 1 / -1;
  color: #3d170c;
  font-size: 20px;
  text-align: center;
  align-self: center;
  padding: 20px;
}

/* Narrow screens keep artwork proportions */
@media (max-width: 850px) {
  .journal {
    width: 100%;
    height: auto;
    min-height: 0;
    aspect-ratio: 1.9 / 1;
  }

  .home {
    padding: 6px 8px;
    font-size: 9px;
    letter-spacing: 1px;
  }

  .recipe-card {
    padding: 2%;
    gap: 2%;
  }

  .recipe-info h2 {
    font-size: clamp(8px, 1.8vw, 15px);
    margin-bottom: 4px;
  }

  .recipe-info p {
    font-size: clamp(7px, 1.1vw, 11px);
    margin-bottom: 5px;
  }

  .open-recipe {
    font-size: clamp(7px, 1vw, 10px);
  }

  .pagination button {
    font-size: 10px;
    padding: 5px 7px;
  }

  .page-number {
    min-width: 24px;
  }
}

/* Phone: enlarge the artwork for readability */
@media (max-width: 560px) {
  body {
    overflow-x: auto;
  }

  .journal {
    width: 950px;
    height: 600px;
    aspect-ratio: auto;
  }

  .recipe-info h2 {
    font-size: 17px;
  }

  .recipe-info p {
    font-size: 11px;
  }

  .open-recipe {
    font-size: 10px;
  }
}
</style>
</head>

<body>

<main class="journal">

  <a class="home" href="index.html">
    ← DeadBrewing
  </a>

  <section
    id="recipeArea"
    class="recipe-area"
    aria-label="DeadBrewing recipes">
  </section>

  <nav class="pagination" aria-label="Recipe pages">

    <button id="previous" type="button">
      ‹ Previous
    </button>

    <div id="pageNumbers" class="page-numbers"></div>

    <button id="next" type="button">
      Next ›
    </button>

  </nav>

</main>

<script>
const recipeArea = document.getElementById("recipeArea");
const pageNumbers = document.getElementById("pageNumbers");
const previous = document.getElementById("previous");
const next = document.getElementById("next");

const RECIPES_PER_PAGE = 4;
const MINIMUM_PAGES = 3;

let recipes = [];
let currentPage = 0;

function escapeHTML(value) {
  return String(value ?? "").replace(
    /[&<>"']/g,
    character => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    }[character])
  );
}

function getGlass(recipe) {
  if (
    ["gold", "red", "brown", "stout"]
      .includes(recipe.glass)
  ) {
    return recipe.glass;
  }

  const text = (
    (recipe.name || "") + " " +
    (recipe.style || "")
  ).toLowerCase();

  if (/stout|porter/.test(text)) {
    return "stout";
  }

  if (/brown|dunkel|mild/.test(text)) {
    return "brown";
  }

  if (/red|amber|ruby/.test(text)) {
    return "red";
  }

  return "gold";
}

function getPageCount() {
  return Math.max(
    MINIMUM_PAGES,
    Math.ceil(recipes.length / RECIPES_PER_PAGE)
  );
}

function showPage(number) {
  const total = getPageCount();

  currentPage = Math.max(
    0,
    Math.min(number, total - 1)
  );

  recipeArea.innerHTML = "";

  const start = currentPage * RECIPES_PER_PAGE;
  const visible = recipes.slice(
    start,
    start + RECIPES_PER_PAGE
  );

  visible.forEach(recipe => {
    const card = document.createElement("a");
    card.className = "recipe-card";

    card.href =
      "recipe.html?id=" +
      encodeURIComponent(recipe.id);

    const glass = getGlass(recipe);

    const image = document.createElement("img");
    image.src = "deadbrewing-glass-" + glass + ".png";
    image.alt = "";
    image.loading = "lazy";

    const info = document.createElement("div");
    info.className = "recipe-info";

    info.innerHTML = `
      <h2>${escapeHTML(recipe.name)}</h2>
      <p>${escapeHTML(recipe.style || "")}</p>
      <span class="open-recipe">Open Recipe →</span>
    `;

    card.append(image, info);
    recipeArea.append(card);
  });

  /* Leave unused parchment panels visible */
  for (let i = visible.length; i < RECIPES_PER_PAGE; i++) {
    const empty = document.createElement("div");
    empty.className = "empty-card";
    recipeArea.append(empty);
  }

  pageNumbers.innerHTML = "";

  for (let i = 0; i < total; i++) {
    const button = document.createElement("button");

    button.type = "button";
    button.className =
      "page-number" +
      (i === currentPage ? " active" : "");

    button.textContent = i + 1;

    button.setAttribute(
      "aria-label",
      "Recipe page " + (i + 1)
    );

    if (i === currentPage) {
      button.setAttribute("aria-current", "page");
    }

    button.addEventListener("click", () => {
      showPage(i);
    });

    pageNumbers.append(button);
  }

  previous.disabled = currentPage === 0;
  next.disabled = currentPage === total - 1;
}

previous.addEventListener("click", () => {
  showPage(currentPage - 1);
});

next.addEventListener("click", () => {
  showPage(currentPage + 1);
});

fetch("journal.json", { cache: "no-store" })
  .then(response => {
    if (!response.ok) {
      throw new Error("Cannot load journal.json");
    }

    return response.json();
  })
  .then(data => {
    const all = [
      ...(Array.isArray(data.recipes) ? data.recipes : []),
      ...(Array.isArray(data.batches) ? data.batches : [])
    ];

    const normalized = all
      .filter(item => item && item.name && item.id)
      .map(item => ({
        ...item,
        name: /^Czech Pilsner$/i.test(item.name)
          ? "Night Shift Pils"
          : item.name
      }));

    /*
      Initially display only these two recipes.
      Additional recipes can be added to this list.
    */
    const featured = [
      "Night Shift Pils",
      "Drop Dead Red"
    ];

    recipes = featured
      .map(name =>
        normalized.find(
          item =>
            item.name.toLowerCase() === name.toLowerCase()
        )
      )
      .filter(Boolean);

    showPage(0);
  })
  .catch(error => {
    console.error(error);

    recipeArea.innerHTML =
      '<p class="error">' +
      'Unable to load the recipe collection.' +
      '</p>';
  });
</script>

</body>
</html>
