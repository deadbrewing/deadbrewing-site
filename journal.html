
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Brew Journal | DeadBrewing</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  min-height: 100%;
  background: #080604;
  font-family: Georgia, serif;
}

/* MAIN JOURNAL BACKGROUND */

.journal {
  position: relative;
  width: 100%;
  aspect-ratio: 1792 / 850;
  background-image: url("deadbrewing-journal-background.png");
  background-size: 100% 100%;
  background-repeat: no-repeat;
}

/* INVISIBLE HOMEPAGE BUTTON OVER THE BOOK */

.book-home {
  position: absolute;
  left: 4%;
  top: 1%;
  width: 37%;
  height: 92%;
  display: block;
  background: transparent;
  border: none;
  z-index: 10;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

.book-home:hover,
.book-home:focus,
.book-home:active {
  background: transparent;
  outline: none;
  box-shadow: none;
}

/* ORIGINAL BOTTOM-LEFT HOME BUTTON */

.home-button {
  position: absolute;
  left: 2%;
  bottom: 2.5%;
  width: 12%;
  z-index: 20;
  display: block;
  transition: transform 0.2s ease;
}

.home-button img {
  display: block;
  width: 100%;
  height: auto;
}

.home-button:hover {
  transform: scale(1.05);
}

/* RECIPE CARDS */

.recipe {
  position: absolute;
  width: 27.1%;
  height: 28%;
  display: flex;
  align-items: center;
  padding: 1.2%;
  color: #351604;
  text-decoration: none;
  overflow: hidden;
}

.recipe img {
  width: 33%;
  height: 90%;
  object-fit: contain;
  flex-shrink: 0;
}

.recipe-info {
  flex: 1;
  min-width: 0;
  padding-left: 3%;
}

.recipe h2 {
  font-size: clamp(12px, 1.65vw, 30px);
  line-height: 1.08;
  margin: 0 0 7px;
  overflow-wrap: anywhere;
}

.recipe p {
  font-size: clamp(9px, 0.9vw, 16px);
  margin: 0 0 12px;
}

.recipe strong {
  font-size: clamp(9px, 0.9vw, 16px);
}

/* INVISIBLE PAGE NAVIGATION */

.hitbox {
  position: absolute;
  display: block;
  padding: 0;
  margin: 0;
  border: none;
  outline: none;
  background: transparent;
  color: transparent;
  font-size: 0;
  box-shadow: none;
  cursor: pointer;
  z-index: 5;
  -webkit-tap-highlight-color: transparent;
}

.hitbox:hover,
.hitbox:focus,
.hitbox:active,
.hitbox.active {
  border: none;
  outline: none;
  background: transparent;
  box-shadow: none;
}

.hitbox:disabled {
  cursor: default;
}

/* PAGE BUTTON POSITIONS */

.previous {
  left: 52%;
  top: 81.1%;
  width: 10%;
  height: 7%;
}

.page1 {
  left: 63.4%;
  top: 81.1%;
  width: 3.8%;
  height: 7%;
}

.page2 {
  left: 67.4%;
  top: 81.1%;
  width: 3.8%;
  height: 7%;
}

.page3 {
  left: 71.4%;
  top: 81.1%;
  width: 3.8%;
  height: 7%;
}

.next {
  left: 77%;
  top: 81.1%;
  width: 10%;
  height: 7%;
}

/* SMALL SCREENS */

@media (max-width: 700px) {
  .journal {
    min-width: 900px;
  }

  body {
    overflow-x: auto;
  }
}
</style>
</head>

<body>

<main class="journal" id="journal">

  <!-- INVISIBLE HOME BUTTON ON THE BOOK -->

  <a
    href="index.html"
    class="book-home"
    aria-label="Return to DeadBrewing homepage by clicking the book">
  </a>

  <!-- ORIGINAL BOTTOM-LEFT HOME BUTTON -->

  <a
    href="index.html"
    class="home-button"
    aria-label="Return to DeadBrewing homepage">

    <img
      src="deadbrewing-back-button.png"
      alt="Back to DeadBrewing">

  </a>

  <!-- RECIPE CARDS -->

  <div id="recipes"></div>

  <!-- INVISIBLE PAGE BUTTONS -->

  <button
    type="button"
    class="hitbox previous"
    aria-label="Previous page"
    onclick="changePage(-1)">
  </button>

  <button
    type="button"
    class="hitbox page1"
    aria-label="Page 1"
    onclick="goToPage(1)">
  </button>

  <button
    type="button"
    class="hitbox page2"
    aria-label="Page 2"
    onclick="goToPage(2)">
  </button>

  <button
    type="button"
    class="hitbox page3"
    aria-label="Page 3"
    onclick="goToPage(3)">
  </button>

  <button
    type="button"
    class="hitbox next"
    aria-label="Next page"
    onclick="changePage(1)">
  </button>

</main>

<script>

/* JOURNAL SETTINGS */

const PAGE_SIZE = 4;
const TOTAL_PAGES = 3;

let currentPage = 1;
let allRecipes = [];

/* BEER GLASS IMAGES */

const GLASSES = {
  gold: "deadbrewing-glass-gold.png",
  red: "deadbrewing-glass-red.png",
  brown: "deadbrewing-glass-brown.png",
  stout: "deadbrewing-glass-stout.png"
};

/* AUTOMATIC GLASS SELECTION */

function chooseGlass(recipe) {

  const text = (
    (recipe.name || "") + " " +
    (recipe.style || "")
  ).toLowerCase();

  if (/stout|porter|imperial dark/.test(text)) {
    return GLASSES.stout;
  }

  if (/red|amber|irish red/.test(text)) {
    return GLASSES.red;
  }

  if (/brown|dunkel|dark lager/.test(text)) {
    return GLASSES.brown;
  }

  return GLASSES.gold;
}

/* SAFE TEXT DISPLAY */

function escapeHTML(value) {

  return String(value ?? "").replace(
    /[&<>"']/g,
    char => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    })[char]
  );

}

/* RENDER CURRENT RECIPE PAGE */

function renderPage() {

  const container = document.getElementById("recipes");

  container.innerHTML = "";

  const start = (currentPage - 1) * PAGE_SIZE;

  const visible = allRecipes.slice(
    start,
    start + PAGE_SIZE
  );

  visible.forEach((recipe, index) => {

    const card = document.createElement("a");

    card.className = "recipe";

    card.style.left =
      index % 2 === 0 ? "42.1%" : "70.5%";

    card.style.top =
      index < 2 ? "20.5%" : "50.5%";

    card.href =
      "recipe.html?id=" +
      encodeURIComponent(recipe.id || "");

    card.innerHTML = `
      <img
        src="${chooseGlass(recipe)}"
        alt=""
        loading="lazy"
      >

      <div class="recipe-info">
        <h2>${escapeHTML(recipe.name)}</h2>
        <p>${escapeHTML(recipe.style)}</p>
        <strong>OPEN RECIPE &rarr;</strong>
      </div>
    `;

    container.appendChild(card);

  });

  /* KEEP PAGE STATE UPDATED */

  document.querySelectorAll(
    ".page1, .page2, .page3"
  ).forEach((button, index) => {

    const selected = index + 1 === currentPage;

    button.classList.toggle("active", selected);

    if (selected) {
      button.setAttribute("aria-current", "page");
    } else {
      button.removeAttribute("aria-current");
    }

  });

  document.querySelector(".previous").disabled =
    currentPage === 1;

  document.querySelector(".next").disabled =
    currentPage === TOTAL_PAGES;

}

/* PAGE NAVIGATION */

function goToPage(page) {

  currentPage = Math.max(
    1,
    Math.min(TOTAL_PAGES, page)
  );

  renderPage();

}

function changePage(direction) {

  goToPage(currentPage + direction);

}

/* LOAD RECIPE DATA */

async function loadRecipes() {

  try {

    const response = await fetch("journal.json", {
      cache: "no-store"
    });

    if (!response.ok) {
      throw new Error("Could not load journal.json");
    }

    const data = await response.json();

    const batches = Array.isArray(data.batches)
      ? data.batches
      : [];

    const recipes = Array.isArray(data.recipes)
      ? data.recipes
      : [];

    const combined = [...batches, ...recipes];

    /* REMOVE DUPLICATE RECIPES */

    const seen = new Set();

    allRecipes = combined.filter(recipe => {

      const key = recipe.id || recipe.name;

      if (!key || seen.has(key)) {
        return false;
      }

      seen.add(key);

      return true;

    }).slice(0, 12);

    renderPage();

  } catch (error) {

    console.error(error);

    document.getElementById("recipes").innerHTML =
      '<p style="position:absolute;left:45%;top:25%;color:#300">' +
      'Unable to load recipes.</p>';

  }

}

loadRecipes();

</script>

</body>
</html>
