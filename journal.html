
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DeadBrewing | Brew Journal</title>

<style>
:root {
  --gold: #f0cb80;
  --paper: #e8c89a;
  --ink: #382015;
}

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  min-height: 100%;
  background: #0b0808;
  color: var(--gold);
  font-family: Georgia, "Times New Roman", serif;
}

body {
  background-image:
    linear-gradient(90deg, rgba(0,0,0,.08), rgba(0,0,0,.15)),
    url("deadbrewing-journal-background.png");
  background-position: center;
  background-size: cover;
  background-attachment: fixed;
}

.home {
  position: fixed;
  top: 18px;
  left: 20px;
  z-index: 5;
  background: #170e0ce6;
  border: 1px solid #b4814e;
  border-radius: 5px;
  padding: 10px 17px;
  color: var(--gold);
  text-decoration: none;
  font-size: 13px;
  letter-spacing: 2px;
  text-transform: uppercase;
}

.home:hover {
  background: #48251a;
}

.layout {
  min-height: 100vh;
  display: grid;
  grid-template-columns: 1fr 1fr;
  align-items: center;
  padding: 75px max(3vw, 20px) 35px;
  gap: 3vw;
}

.left {
  min-height: 60vh;
}

.right {
  width: 100%;
  max-width: 650px;
  justify-self: center;
  padding: 24px;
  border: 1px solid #6e3e25;
  border-radius: 9px;
  background: linear-gradient(150deg, #21130de8, #0c0908ee);
  box-shadow: 0 15px 55px #000c;
}

.heading {
  text-align: center;
  margin: 0 0 6px;
  font-size: clamp(23px, 3vw, 38px);
  letter-spacing: 3px;
  text-shadow: 0 2px 5px #000;
}

.sub {
  text-align: center;
  color: #cba26d;
  font-size: 12px;
  letter-spacing: 3px;
  text-transform: uppercase;
  margin: 0 0 20px;
}

.cards {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  min-height: 430px;
}

.recipe {
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: 202px;
  padding: 12px 10px;
  text-decoration: none;
  color: var(--ink);
  border: 2px solid #9a6a38;
  border-radius: 6px;
  background: linear-gradient(135deg, #f2d8a7, #d6ab74);
  box-shadow:
    inset 0 0 22px #7b451b3b,
    0 3px 12px #0008;
  transition: transform .15s, filter .15s;
}

.recipe:hover,
.recipe:focus-visible {
  transform: translateY(-3px);
  filter: brightness(1.08);
  outline: 2px solid #eac180;
}

.recipe img {
  width: 42%;
  max-height: 170px;
  object-fit: contain;
  flex-shrink: 0;
  filter: drop-shadow(0 4px 4px #3d210955);
}

.recipe-text {
  min-width: 0;
  flex: 1;
}

.recipe h2 {
  font-size: clamp(14px, 1.45vw, 21px);
  line-height: 1.14;
  margin: 0 0 9px;
}

.recipe p {
  font-size: 12px;
  line-height: 1.35;
  margin: 0 0 9px;
}

.recipe span {
  font-size: 11px;
  font-weight: bold;
  letter-spacing: 1px;
  text-transform: uppercase;
}

.empty {
  border: 1px dashed #8a613c80;
  border-radius: 6px;
  background: #b28b5d20;
  min-height: 202px;
}

.pager {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 12px;
  margin-top: 20px;
}

.pager button {
  cursor: pointer;
  background: #342016;
  color: var(--gold);
  border: 1px solid #a77a45;
  padding: 9px 13px;
  font-family: inherit;
  border-radius: 4px;
}

.pager button:disabled {
  opacity: .35;
  cursor: default;
}

.pager strong {
  font-size: 13px;
  letter-spacing: 2px;
}

.message {
  text-align: center;
  padding: 50px 10px;
  color: #f3ce8c;
  grid-column: 1 / -1;
}

@media (max-width: 800px) {
  body {
    background-attachment: scroll;
    background-position: 33% top;
  }

  .layout {
    display: block;
    padding: 78px 14px 30px;
  }

  .left {
    min-height: 28vh;
  }

  .right {
    max-width: 650px;
    margin: auto;
    padding: 15px;
  }

  .cards {
    min-height: 0;
  }

  .recipe,
  .empty {
    min-height: 165px;
  }
}

@media (max-width: 460px) {
  .cards {
    grid-template-columns: 1fr;
  }

  .recipe,
  .empty {
    min-height: 145px;
  }

  .recipe img {
    max-height: 130px;
    width: 33%;
  }

  .heading {
    font-size: 25px;
  }
}
</style>
</head>

<body>

<a class="home" href="index.html">← DeadBrewing</a>

<main class="layout">

  <div class="left" aria-hidden="true"></div>

  <section class="right" aria-label="Recipe collection">

    <h1 class="heading">THE BREW JOURNAL</h1>
    <p class="sub">Recipes from the Crypt</p>

    <div id="cards" class="cards">
      <p class="message">Opening the recipe book…</p>
    </div>

    <nav class="pager" aria-label="Recipe pages">
      <button id="prev" type="button">‹ Previous</button>
      <strong id="page">1 / 3</strong>
      <button id="next" type="button">Next ›</button>
    </nav>

  </section>

</main>

<script>
const cards = document.getElementById("cards");
const pageLabel = document.getElementById("page");
const prev = document.getElementById("prev");
const next = document.getElementById("next");

const PAGE_SIZE = 4;
const MIN_PAGES = 3;

let recipes = [];
let page = 0;

function glassFor(recipe) {
  const name = (
    (recipe.name || "") + " " +
    (recipe.style || "")
  ).toLowerCase();

  if (/stout|porter|imperial dark/.test(name)) {
    return "stout";
  }

  if (/brown|dunkel|mild/.test(name)) {
    return "brown";
  }

  if (/red|ruby|irish red|amber/.test(name)) {
    return "red";
  }

  return "gold";
}

function slug(text) {
  return String(text || "")
    .toLowerCase()
    .replace(/[^a-z0-9]+/g, "-")
    .replace(/^-|-$/g, "");
}

function escapeHTML(text) {
  return String(text ?? "").replace(
    /[&<>"']/g,
    char => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    }[char])
  );
}

function render() {
  const total = Math.max(
    MIN_PAGES,
    Math.ceil(recipes.length / PAGE_SIZE)
  );

  page = Math.max(0, Math.min(page, total - 1));

  cards.innerHTML = "";

  const selection = recipes.slice(
    page * PAGE_SIZE,
    (page + 1) * PAGE_SIZE
  );

  selection.forEach(recipe => {
    const link = document.createElement("a");
    link.className = "recipe";

    link.href =
      "recipe.html?id=" +
      encodeURIComponent(
        recipe.id || slug(recipe.name)
      );

    const img = document.createElement("img");

    img.src =
      "deadbrewing-glass-" +
      (recipe.glass || glassFor(recipe)) +
      ".png";

    img.alt = "";
    img.loading = "lazy";

    const info = document.createElement("div");
    info.className = "recipe-text";

    info.innerHTML =
      "<h2>" + escapeHTML(recipe.name) + "</h2>" +
      "<p>" +
      escapeHTML(recipe.style || "DeadBrewing original") +
      "</p>" +
      "<span>Open recipe →</span>";

    link.append(img, info);
    cards.append(link);
  });

  for (let i = selection.length; i < PAGE_SIZE; i++) {
    const slot = document.createElement("div");
    slot.className = "empty";
    slot.setAttribute("aria-hidden", "true");
    cards.append(slot);
  }

  pageLabel.textContent = (page + 1) + " / " + total;

  prev.disabled = page === 0;
  next.disabled = page === total - 1;
}

prev.addEventListener("click", () => {
  page--;
  render();
});

next.addEventListener("click", () => {
  page++;
  render();
});

fetch("journal.json", { cache: "no-store" })
  .then(response => {
    if (!response.ok) {
      throw Error("Could not load journal.json");
    }
    return response.json();
  })
  .then(data => {
    const all = [
      ...(Array.isArray(data.recipes) ? data.recipes : []),
      ...(Array.isArray(data.batches) ? data.batches : [])
    ];

    const wanted = [
      "Night Shift Pils",
      "Drop Dead Red"
    ];

    const normalized = all
      .filter(recipe => recipe && recipe.name)
      .map(recipe => ({
        ...recipe,
        name: /^Czech Pilsner$/i.test(recipe.name)
          ? "Night Shift Pils"
          : recipe.name,
        id: recipe.id || slug(recipe.name)
      }));

    recipes = wanted
      .map(name =>
        normalized.find(
          recipe =>
            recipe.name.toLowerCase() === name.toLowerCase()
        )
      )
      .filter(Boolean);

    render();
  })
  .catch(error => {
    cards.innerHTML =
      '<p class="message">' +
      'Unable to load recipes. ' +
      'Check journal.json is uploaded alongside journal.html.' +
      '</p>';

    console.error(error);
  });
</script>

</body>
</html>
