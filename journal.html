
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080d13">
  <title>The Brew Journal | DeadBrewing</title>

  <style>
    :root {
      --bg: #080d13;
      --panel: #121d2a;
      --blue: #79cfff;
      --rust: #d77b37;
      --text: #e4eaf0;
      --muted: #a2b0be;
      --border: #354b60;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(ellipse at 50% 0%, #152b40 0%, transparent 55%),
        var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    header {
      background: #0b121c;
      border-bottom: 2px solid var(--rust);
      padding: 22px 18px;
      text-align: center;
    }

    .brand {
      color: var(--blue);
      font-size: clamp(28px, 6vw, 46px);
      font-weight: 900;
      letter-spacing: 4px;
      text-decoration: none;
      text-transform: uppercase;
    }

    nav {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px 24px;
      margin-top: 16px;
    }

    nav a {
      color: var(--text);
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 1px;
      text-decoration: none;
      text-transform: uppercase;
    }

    nav a:hover,
    nav a[aria-current="page"] {
      color: var(--blue);
    }

    main {
      max-width: 1100px;
      margin: auto;
      padding: 48px 20px 90px;
    }

    h1 {
      color: var(--blue);
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 4px;
      font-size: clamp(30px, 5vw, 48px);
      margin: 0;
    }

    .intro {
      color: var(--muted);
      text-align: center;
      margin: 12px auto 48px;
      max-width: 600px;
      line-height: 1.6;
    }

    .recipe-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 28px;
    }

    .recipe-card {
      display: block;
      overflow: hidden;
      background: var(--panel);
      border: 1px solid var(--border);
      border-top: 3px solid var(--rust);
      border-radius: 10px;
      color: inherit;
      text-decoration: none;
      transition: transform .2s, border-color .2s;
    }

    .recipe-card:hover {
      transform: translateY(-5px);
      border-color: var(--blue);
    }

    .artwork {
      aspect-ratio: 4 / 3;
      background:
        radial-gradient(circle at 50% 35%, #244764, #101923 70%);
      display: flex;
      align-items: center;
      justify-content: center;
      border-bottom: 1px solid var(--border);
      overflow: hidden;
    }

    .artwork img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .art-placeholder {
      color: #6c92aa;
      font-size: 72px;
      opacity: .7;
    }

    .card-body {
      padding: 24px;
    }

    .card-style {
      color: var(--rust);
      text-transform: uppercase;
      font-size: 12px;
      letter-spacing: 2px;
      font-weight: bold;
    }

    .card-title {
      color: #fff;
      font-size: clamp(23px, 3vw, 32px);
      text-transform: uppercase;
      letter-spacing: 2px;
      margin: 10px 0;
    }

    .card-description {
      color: var(--muted);
      line-height: 1.6;
      font-size: 14px;
      min-height: 65px;
    }

    .view-link {
      display: inline-block;
      color: var(--blue);
      font-weight: bold;
      font-size: 13px;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-top: 18px;
    }

    footer {
      border-top: 1px solid var(--border);
      padding: 28px 15px;
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 1px;
    }

    @media (max-width: 700px) {
      .recipe-grid {
        grid-template-columns: 1fr;
      }
      main {
        padding: 32px 15px 60px;
      }
    }
  </style>
</head>

<body>
  <header>
    <a class="brand" href="index.html">DeadBrewing</a>

    <nav>
      <a href="index.html">Home</a>
      <a href="journal.html" aria-current="page">Brew Journal</a>
      <a href="crypt.html">The Crypt</a>
      <a href="vip.html">VIP</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <main>
    <h1>The Brew Journal</h1>

    <p class="intro">
      From the grain bill to the final pour.
      Explore the recipes forged in the DeadBrewing crypt.
    </p>

    <div class="recipe-grid" id="recipe-grid">
      <p>Loading recipes...</p>
    </div>
  </main>

  <footer>
    DEADBREWING &bull; BREWED AFTER DARK
  </footer>

  <script>
    function escapeHTML(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    async function loadRecipes() {
      const grid = document.getElementById("recipe-grid");

      try {
        const response = await fetch("journal.json", {
          cache: "no-store"
        });

        if (!response.ok) {
          throw new Error("Could not load journal.json");
        }

        const data = await response.json();

        const allRecipes = [
          ...(Array.isArray(data.batches) ? data.batches : []),
          ...(Array.isArray(data.recipes) ? data.recipes : [])
        ];

        const selectedIds = [
          "czech-pilsner",
          "drop-dead-red"
        ];

        const recipes = selectedIds
          .map(id => allRecipes.find(recipe => recipe.id === id))
          .filter(Boolean);

        if (!recipes.length) {
          grid.innerHTML = "<p>No recipes available.</p>";
          return;
        }

        grid.innerHTML = recipes.map(recipe => {
          const artwork = recipe.artwork
            ? `<img src="${escapeHTML(recipe.artwork)}"
                    alt="${escapeHTML(recipe.name)} artwork">`
            : `<div class="art-placeholder">☠</div>`;

          return `
            <a class="recipe-card"
               href="recipe.html?id=${encodeURIComponent(recipe.id)}">
              <div class="artwork">${artwork}</div>

              <div class="card-body">
                <div class="card-style">
                  ${escapeHTML(recipe.style)}
                </div>

                <h2 class="card-title">
                  ${escapeHTML(recipe.name)}
                </h2>

                <p class="card-description">
                  ${escapeHTML(recipe.description)}
                </p>

                <span class="view-link">
                  View Recipe &rarr;
                </span>
              </div>
            </a>
          `;
        }).join("");

      } catch (error) {
        console.error(error);
        grid.innerHTML = "<p>Unable to load recipes.</p>";
      }
    }

    loadRecipes();
  </script>
</body>
</html>
