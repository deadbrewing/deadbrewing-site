
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DeadBrewing | Brew Journal</title>

<style>
* { box-sizing: border-box; }

:root {
  --blue: #74ceff;
  --gold: #ffe3a1;
  --rust: #b85a28;
  --dark: #090b10;
}

html, body {
  margin: 0;
  min-height: 100%;
  background: var(--dark);
  color: var(--gold);
  font-family: Georgia, serif;
}

body {
  background:
    radial-gradient(ellipse at 50% 0%,
      rgba(24, 91, 140, .35), transparent 55%),
    repeating-linear-gradient(0deg,
      transparent 0 38px,
      rgba(255,255,255,.015) 39px 40px),
    #090b10;
}

a { color: inherit; }

header {
  text-align: center;
  padding: 35px 15px 25px;
  border-bottom: 3px solid #67351f;
  background: linear-gradient(#151a24, #090b10);
}

.brand {
  color: var(--blue);
  text-decoration: none;
  font-size: clamp(22px, 4vw, 42px);
  font-weight: bold;
  text-shadow: 0 0 15px #1576b0;
}

.subtitle {
  margin: 12px 0;
  color: #d8b27b;
  letter-spacing: 4px;
  font-size: 12px;
}

.back {
  display: inline-block;
  margin-top: 12px;
  padding: 10px 20px;
  border: 1px solid var(--rust);
  border-radius: 5px;
  text-decoration: none;
  background: #261b18;
}

.back:hover {
  box-shadow: 0 0 12px var(--rust);
}

main {
  max-width: 1050px;
  margin: 0 auto;
  padding: 28px 16px 80px;
}

.section-title {
  color: var(--blue);
  letter-spacing: 3px;
  font-size: 15px;
  border-bottom: 1px solid #34516b;
  padding-bottom: 12px;
  margin: 35px 0 20px;
}

.batch {
  background: linear-gradient(145deg, #1c2530, #10131a);
  border: 2px solid #774226;
  border-radius: 10px;
  margin-bottom: 25px;
  overflow: hidden;
  box-shadow: 0 10px 35px #0009;
}

.batch.featured {
  border-color: #a35c2b;
  box-shadow: 0 0 25px #185c8640;
}

.batch-head {
  padding: 25px;
}

.batch-number {
  color: var(--blue);
  letter-spacing: 2px;
  font-size: 12px;
  font-weight: bold;
}

.batch h2 {
  margin: 12px 0 8px;
  color: #fff0c7;
  font-size: clamp(23px, 3.5vw, 34px);
}

.meta {
  color: #aebdca;
  font-size: 14px;
}

.description {
  color: #d3dce3;
  line-height: 1.7;
  margin: 18px 0;
}

.stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  margin-top: 20px;
}

.stat {
  text-align: center;
  background: #253544;
  border: 1px solid #344c5f;
  border-radius: 6px;
  padding: 12px 5px;
}

.stat small {
  display: block;
  color: #9bb5c7;
  font-size: 11px;
  margin-bottom: 6px;
}

.stat strong {
  font-size: clamp(13px, 2vw, 19px);
  color: white;
}

.technical {
  padding: 0 25px 25px;
}

details {
  margin-top: 9px;
  border: 1px solid #364c5c;
  border-radius: 5px;
  background: #141f2a;
}

summary {
  cursor: pointer;
  padding: 15px;
  color: var(--blue);
  font-weight: bold;
  letter-spacing: 1px;
}

summary:hover {
  background: #213447;
}

.detail-content {
  padding: 5px 15px 18px;
  color: #e0e6ec;
}

.detail-row {
  display: flex;
  justify-content: space-between;
  gap: 20px;
  padding: 9px 0;
  border-bottom: 1px solid #30404d;
  font-size: 14px;
}

.detail-row span:last-child {
  text-align: right;
  color: #fff0c7;
}

.note {
  color: #aebdca;
  line-height: 1.7;
  font-size: 14px;
}

.message {
  text-align: center;
  padding: 35px;
  color: #aebdca;
}

footer {
  text-align: center;
  color: #9b8b7a;
  padding: 25px;
  border-top: 1px solid #463021;
  font-size: 12px;
}

@media(max-width: 600px) {
  .stats { grid-template-columns: repeat(2, 1fr); }
  .batch-head { padding: 18px; }
  .technical { padding: 0 18px 18px; }
}
</style>
</head>

<body>

<header>
  <a class="brand" href="index.html">DEADBREWING</a>
  <div class="subtitle">EST. 2018 • THE BREW JOURNAL</div>
  <a class="back" href="index.html">← BACK TO THE BREWERY</a>
</header>

<main>
  <h1 class="section-title">LATEST BREW</h1>
  <div id="latest">
    <p class="message">Loading the latest batch...</p>
  </div>

  <h2 class="section-title">THE BATCH ARCHIVE</h2>
  <div id="archive"></div>
</main>

<footer>
  DEADBREWING • BREWED IN DARKNESS • EST. 2018
</footer>

<script>
"use strict";

const escapeHTML = value =>
  String(value ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[c]);

function display(value, suffix = "") {
  if (value === null || value === undefined || value === "") {
    return "—";
  }
  return escapeHTML(value) + suffix;
}

function rows(items) {
  if (!Array.isArray(items) || !items.length) {
    return '<p class="note">Details coming soon.</p>';
  }

  return items.map(item => `
    <div class="detail-row">
      <span>${escapeHTML(item.label)}</span>
      <span>${display(item.value)}</span>
    </div>
  `).join("");
}

function section(title, content) {
  return `
    <details>
      <summary>${escapeHTML(title)}</summary>
      <div class="detail-content">${content}</div>
    </details>
  `;
}

function makeBatch(beer, featured = false) {
  const number = String(beer.batchNumber).padStart(3, "0");

  const stats = [
    ["OG", beer.og],
    ["FG", beer.fg],
    ["ABV", beer.abv == null ? null : beer.abv + "%"],
    ["IBU", beer.ibu]
  ];

  const statHTML = stats.map(([label, value]) => `
    <div class="stat">
      <small>${label}</small>
      <strong>${display(value)}</strong>
    </div>
  `).join("");

  const grain = rows(beer.grain);
  const hops = rows(beer.hops);
  const water = rows(beer.water);
  const mash = rows(beer.mash);
  const fermentation = rows(beer.fermentation);

  const tasting = beer.tastingNotes
    ? `<p class="note">${escapeHTML(beer.tastingNotes)}</p>`
    : '<p class="note">Tasting notes coming soon.</p>';

  return `
    <article class="batch ${featured ? "featured" : ""}">
      <div class="batch-head">
        <div class="batch-number">
          BATCH #${number}
          ${featured ? " • LATEST BREW" : ""}
        </div>

        <h2>${escapeHTML(beer.name)}</h2>

        <div class="meta">
          ${escapeHTML(beer.style || "")}
          ${beer.date ? " • " + escapeHTML(beer.date) : ""}
        </div>

        <p class="description">
          ${escapeHTML(beer.description || "")}
        </p>

        <div class="stats">${statHTML}</div>
      </div>

      <div class="technical">
        ${section("GRAIN BILL • %", grain)}
        ${section("HOP SCHEDULE • AA% / TIMING", hops)}
        ${section("WATER PROFILE • PPM", water)}
        ${section("MASH SCHEDULE", mash)}
        ${section("FERMENTATION", fermentation)}
        ${section("BREWER'S VERDICT", tasting)}
      </div>
    </article>
  `;
}

async function loadJournal() {
  const latest = document.getElementById("latest");
  const archive = document.getElementById("archive");

  try {
    const response = await fetch(
      "journal.json",
      { cache: "no-store" }
    );

    if (!response.ok) {
      throw new Error("Could not load journal.json");
    }

    const data = await response.json();

    const batches = Array.isArray(data.batches)
      ? data.batches
      : [];

    batches.sort(
      (a, b) => Number(b.batchNumber) - Number(a.batchNumber)
    );

    if (!batches.length) {
      latest.innerHTML =
        '<p class="message">No batches recorded yet.</p>';
      return;
    }

    latest.innerHTML = makeBatch(batches[0], true);

    archive.innerHTML = batches.slice(1)
      .map(beer => makeBatch(beer))
      .join("");

  } catch (error) {
    console.error(error);
    latest.innerHTML =
      '<p class="message">Brew Journal temporarily unavailable.</p>';
  }
}

loadJournal();
</script>

</body>
</html>
