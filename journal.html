
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>DeadBrewing | Brew Journal</title>

<style>
* {
  box-sizing: border-box;
}

:root {
  --ink: #321a0e;
}

html, body {
  margin: 0;
  min-height: 100%;
  background: #080606;
  font-family: Georgia, "Times New Roman", serif;
}

/* Full-screen journal artwork */
.journal {
  position: relative;
  width: 100%;
  height: 100vh;
  min-height: 650px;
  overflow: hidden;

  background-image: url("deadbrewing-journal-background.png");
  background-position: center;
  background-repeat: no-repeat;
  background-size: 100% 100%;
}

/* Clickable book cover returns home */
.book-home {
  position: absolute;
  left: 4%;
  top: 3%;
  width: 37%;
  height: 91%;
  z-index: 2;
  cursor: pointer;
  background: transparent;
}

.book-home:focus-visible {
  outline: 3px solid #f0c77c;
  outline-offset: -5px;
}

/* Recipe cards */
.recipe-area {
  position: absolute;
  left: 42.2%;
  top: 17.6%;
  width: 55.8%;
  height: 67.5%;

  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-template-rows: 1fr 1fr;

  column-gap: 2.6%;
  row-gap: 3.6%;
}

.recipe-card {
  display: flex;
  align-items: center;
  gap: 3%;
  padding: 4%;

  color: var(--ink);
  text-decoration: none;
  border-radius: 8px;
  background: transparent;

  transition:
    transform .18s ease,
    filter .18s ease;
}

.recipe-card:hover {
  transform: scale(1.025);
  filter: brightness(1.12);
}

.recipe-card:focus-visible {
  outline: 3px solid #e9b45b;
  outline-offset: -4px;
}

.recipe-card img {
  width: 43%;
  height: 88%;
  object-fit: contain;
  flex-shrink: 0;

  filter: drop-shadow(2px 5px 4px #43200a70);
}

.recipe-info {
  flex: 1;
  min-width: 0;
}

.recipe-info h2 {
  margin: 0 0 10px;
  font-size: clamp(15px, 1.65vw, 30px);
  line-height: 1.08;
  color: #32170b;
  text-shadow: 0 1px 1px #ffe4b8;
}

.recipe-info p {
  margin: 0 0 14px;
  font-size: clamp(10px, .85vw, 15px);
  line-height: 1.25;
  color: #57301b;
}

.open-recipe {
  font-size: clamp(10px, .85vw, 15px);
  font-weight: bold;
  letter-spacing: .6px;
  color: #3d1c0d;
  text-transform: uppercase;
}

/* Empty slots reveal parchment artwork */
.empty-card {
  pointer-events: none;
}

/*
  Invisible clickable regions over the
  navigation painted into the background.
*/
.pagination {
  position: absolute;
  left: 51.8%;
  top: 82.7%;
  width: 38.7%;
  height: 7%;
  z-index: 3;

  display: grid;
  grid-template-columns: 1.9fr .65fr .65fr .65fr 1.9fr;
  gap: 1%;
}

.pagination button {
  border: 0;
  background: transparent;
  color: transparent;
  font-size: 0;
  padding: 0;
  cursor: pointer;
}

.pagination button:disabled {
  cursor: default;
}

.pagination button:focus-visible {
  outline: 2px solid #ffd37e;
  outline-offset: -3px;
  border-radius: 5px;
}

/* Optional subtle indication of selected page */
.pagination button.active {
  box-shadow: inset 0 0 10px #ffd26a35;
  border-radius: 5px;
}

.error {
  grid-column: 1 / -1;
  align-self: center;
  text-align: center;
  color: #411c0d;
  font-size: 20px;
  padding: 20px;
}

/* Smaller screens */
@media (max-width: 850px) {
  .journal {
    height: auto;
    min-height: 0;
    aspect-ratio: 1.9 / 1;
  }

  .recipe-card {
    padding: 2%;
    gap: 2%;
  }

  .recipe-info h2 {
    font-size: clamp(8px, 1.8vw, 15px);
    margin-bottom: 4px;
  }

  .recipe-info p {
    font-size: clamp(7px, 1.1vw, 11px);
    margin-bottom: 5px;
  }

  .open-recipe {
    font-size: clamp(7px, 1vw, 10px);
  }
}

@media (max-width: 560px) {
  body {
    overflow-x: auto;
  }

  .journal {
    width: 950px;
    height: 600px;
    aspect-ratio: auto;
  }

  .recipe-info h2 {
    font-size: 17px;
  }

  .recipe-info p {
    font-size: 11px;
  }

  .open-recipe {
    font-size: 10px;
  }
}
</style>
</head>

<body>

<main class="journal">

  <!-- Click the book to return home -->
  <a
    class="book-home"
    href="index.html"
    aria-label="Return to DeadBrewing homepage"
    title="Return to DeadBrewing">
  </a>

  <!-- Recipe cards -->
  <section
    id="recipeArea"
    class="recipe-area"
    aria-label="DeadBrewing recipes">
  </section>

  <!-- Invisible buttons over artwork navigation -->
  <nav class="pagination" aria-label="Recipe pages">

    <button id="previous" type="button"
      aria-label="Previous page">Previous</button>

    <button class="page-button" data-page="0"
      type="button" aria-label="Page 1">1</button>

    <button class="page-button" data-page="1"
      type="button" aria-label="Page 2">2</button>

    <button class="page-button" data-page="2"
      type="button" aria-label="Page 3">3</button>

    <button id="next" type="button"
      aria-label="Next page">Next</button>

  </nav>

</main>

<script>
const recipeArea = document.getElementById("recipeArea");
const previous = document.getElementById("previous");
const next = document.getElementById("next");

const pageButtons = [
  ...document.querySelectorAll(".page-button")
];

const RECIPES_PER_PAGE = 4;
const TOTAL_PAGES = 3;

let recipes = [];
let currentPage = 0;

function escapeHTML(value) {
  return String(value ?? "").replace(
    /[&<>"']/g,
    character => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    }[character])
  );
}

function getGlass(recipe) {
  if (
    ["gold", "red", "brown", "stout"]
      .includes(recipe.glass)
  ) {
    return recipe.glass;
  }

  const text = (
    (recipe.name || "") + " " +
    (recipe.style || "")
  ).toLowerCase();

  if (/stout|porter/.test(text)) {
    return "stout";
  }

  if (/brown|dunkel|mild/.test(text)) {
    return "brown";
  }

  if (/red|amber|ruby/.test(text)) {
    return "red";
  }

  return "gold";
}

function showPage(number) {
  currentPage = Math.max(
    0,
    Math.min(number, TOTAL_PAGES - 1)
  );

  recipeArea.innerHTML = "";

  const start = currentPage * RECIPES_PER_PAGE;
  const visible = recipes.slice(
    start,
    start + RECIPES_PER_PAGE
  );

  visible.forEach(recipe => {
    const card = document.createElement("a");
    card.className = "recipe-card";

    card.href =
      "recipe.html?id=" +
      encodeURIComponent(recipe.id);

    const image = document.createElement("img");
    image.src =
      "deadbrewing-glass-" + getGlass(recipe) + ".png";
    image.alt = "";
    image.loading = "lazy";

    const info = document.createElement("div");
    info.className = "recipe-info";

    info.innerHTML = `
      <h2>${escapeHTML(recipe.name)}</h2>
      <p>${escapeHTML(recipe.style || "")}</p>
      <span class="open-recipe">Open Recipe →</span>
    `;

    card.append(image, info);
    recipeArea.append(card);
  });

  /* Unused slots stay blank */
  for (let i = visible.length; i < RECIPES_PER_PAGE; i++) {
    const empty = document.createElement("div");
    empty.className = "empty-card";
    recipeArea.append(empty);
  }

  previous.disabled = currentPage === 0;
  next.disabled = currentPage === TOTAL_PAGES - 1;

  pageButtons.forEach((button, index) => {
    button.classList.toggle(
      "active",
      index === currentPage
    );

    if (index === currentPage) {
      button.setAttribute("aria-current", "page");
    } else {
      button.removeAttribute("aria-current");
    }
  });
}

previous.addEventListener("click", () => {
  showPage(currentPage - 1);
});

next.addEventListener("click", () => {
  showPage(currentPage + 1);
});

pageButtons.forEach(button => {
  button.addEventListener("click", () => {
    showPage(Number(button.dataset.page));
  });
});

fetch("journal.json", { cache: "no-store" })
  .then(response => {
    if (!response.ok) {
      throw new Error("Cannot load journal.json");
    }

    return response.json();
  })
  .then(data => {
    const all = [
      ...(Array.isArray(data.recipes) ? data.recipes : []),
      ...(Array.isArray(data.batches) ? data.batches : [])
    ];

    const normalized = all
      .filter(item => item && item.name && item.id)
      .map(item => ({
        ...item,
        name: /^Czech Pilsner$/i.test(item.name)
          ? "Night Shift Pils"
          : item.name
      }));

    /* Only the two permanent recipes for now */
    const featured = [
      "Night Shift Pils",
      "Drop Dead Red"
    ];

    recipes = featured
      .map(name =>
        normalized.find(
          item =>
            item.name.toLowerCase() === name.toLowerCase()
        )
      )
      .filter(Boolean);

    showPage(0);
  })
  .catch(error => {
    console.error(error);

    recipeArea.innerHTML =
      '<p class="error">' +
      'Unable to load the recipe collection.' +
      '</p>';
  });
</script>

</body>
</html>
