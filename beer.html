<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Beer | DeadBrewing</title><style>body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#562012,#100a0b 65%);color:#fbe9cf;font-family:Georgia,serif;display:grid;place-items:center;padding:24px}main{max-width:600px;border:2px solid #a65a2d;background:#180f10;padding:32px;box-shadow:0 0 25px #752b14}h1{color:#ff9a4b;font-size:clamp(30px,6vw,50px)}a{color:#ffb873}</style></head><body><main><a href="index.html">← Back to DeadBrewing</a><div id="detail"><p>Loading beer details…</p></div></main><script>const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));fetch('beers.json').then(r=>r.json()).then(d=>{let b=d.beers.find(x=>x.id===new URLSearchParams(location.search).get('id'));document.getElementById('detail').innerHTML=b?`<h1>${esc(b.name)}</h1><p><strong>${esc(b.style)}</strong> · ${esc(b.abv)}% ABV</p><p>${esc(b.description)}</p><p>Status: ${b.status==='on-tap'?'On Tap':'The Crypt'}</p>`:'<h1>Beer not found</h1>';}).catch(()=>document.getElementById('detail').textContent='Could not load beer details.');</script></body></html>
