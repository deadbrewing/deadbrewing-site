<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Beer | DeadBrewing</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080606;color:#fff1d8;font-family:Georgia,'Times New Roman',serif}
.viewport{width:100%;overflow-x:auto}
.art{position:relative;width:min(100%,1199px);min-width:620px;aspect-ratio:1199/1312;margin:auto;background:url('deadbrewing-beer-background.png') center/100% 100% no-repeat}
.beer-name{position:absolute;left:52%;top:20.8%;width:41%;height:9%;display:flex;align-items:center;justify-content:center;text-align:center;color:#ffdfb0;font-size:clamp(17px,3.6vw,48px);font-weight:bold;line-height:1.05;text-shadow:2px 3px 3px #000,0 0 8px #e65a22;overflow-wrap:anywhere}
.value{position:absolute;left:65%;width:27%;height:4.6%;display:flex;align-items:center;justify-content:center;text-align:center;color:#ffe5bb;font-weight:bold;font-size:clamp(12px,2.3vw,29px);line-height:1.05;text-shadow:1px 2px 3px #000;overflow-wrap:anywhere}
#abv{top:33.1%}#style{top:40.1%;font-size:clamp(11px,1.85vw,24px)}#hops{top:47.0%;font-size:clamp(11px,1.85vw,24px)}#ibu{top:54.0%}
.story{position:absolute;left:15%;top:71%;width:70%;height:18%;display:flex;align-items:center;justify-content:center;text-align:center;color:#21120d;font-size:clamp(12px,1.8vw,23px);font-weight:bold;line-height:1.25;overflow:auto;padding:1%;white-space:pre-line;overflow-wrap:anywhere}
.back{display:block;text-align:center;padding:18px;color:#ffb46c;font:17px Georgia,serif}
@media(max-width:620px){.beer-name{font-size:22px}.value{font-size:15px!important}.story{font-size:12px}}
</style>
</head>
<body>
<div class="viewport">
  <main class="art" aria-label="DeadBrewing beer description">
    <h1 class="beer-name" id="name">Loading...</h1>
    <div class="value" id="abv" aria-label="Alcohol by volume">—</div>
    <div class="value" id="style" aria-label="Beer style">—</div>
    <div class="value" id="hops" aria-label="Hops">—</div>
    <div class="value" id="ibu" aria-label="Bitterness in IBU">—</div>
    <div class="story" id="story">Loading beer information...</div>
  </main>
</div>
<a class="back" href="index.html">← Back to DeadBrewing</a>
<script>
const id=new URLSearchParams(location.search).get('id');
fetch('beers.json')
  .then(r=>{if(!r.ok)throw Error('Beer data unavailable');return r.json()})
  .then(data=>{
    const beer=data.beers.find(b=>b.id===id);
    if(!beer)throw Error('Beer not found');
    document.title=beer.name+' | DeadBrewing';
    document.getElementById('name').textContent=beer.name;
    document.getElementById('abv').textContent=beer.abv==null?'—':beer.abv+'%';
    document.getElementById('style').textContent=beer.style||'—';
    document.getElementById('hops').textContent=beer.hops||'—';
    document.getElementById('ibu').textContent=beer.ibu??'—';
    document.getElementById('story').textContent=beer.story||beer.description||'Coming soon.';
  })
  .catch(err=>{
    document.getElementById('name').textContent=err.message;
    document.getElementById('story').textContent='Return to the homepage and select a beer.';
  });
</script>
</body>
</html>
