
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beer | DeadBrewing</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  min-height: 100%;
  background: #080606;
  color: #fff0d7;
  font-family: Georgia, serif;
}

/* 16:9 artwork, matching the homepage */
.page {
  position: relative;
  width: min(100vw, 177.37vh, 1646px);
  aspect-ratio: 1646 / 928;
  margin: 0 auto;
  background-image: url("deadbrewing-beer-background.png");
  background-size: 100% 100%;
  background-position: center;
  background-repeat: no-repeat;
}

/* Editable information */
.beer-name,
.beer-value,
.story-text {
  position: absolute;
  z-index: 2;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  overflow-wrap: anywhere;
}

/* Beer name in upper-right plaque */
.beer-name {
  left: 60%;
  top: 17%;
  width: 35%;
  height: 11%;
  padding: 1%;
  color: #ffe0b5;
  font-size: clamp(12px, 3.5vh, 40px);
  font-weight: bold;
  line-height: 1.05;
  text-shadow: 2px 3px 4px #000;
}

/* Beer values on right */
.beer-value {
  left: 75%;
  width: 19%;
  height: 6%;
  color: #ffe0b5;
  font-size: clamp(10px, 2.5vh, 27px);
  font-weight: bold;
  line-height: 1.1;
  text-shadow: 2px 2px 3px #000;
}

#abv {
  top: 31%;
}

#beer-style {
  top: 39%;
}

#hops {
  top: 47%;
}

#ibu {
  top: 55%;
}

/* Story on parchment */
.story-text {
  left: 11%;
  top: 72%;
  width: 78%;
  height: 18%;
  padding: 1%;
  color: #28150d;
  font-size: clamp(10px, 2vh, 22px);
  font-weight: bold;
  line-height: 1.35;
  overflow-y: auto;
  scrollbar-width: thin;
  scrollbar-color: #87502e transparent;
}

/* Return link */
.back {
  position: absolute;
  right: 3%;
  bottom: 1%;
  z-index: 3;
  color: #ffe0b5;
  font-size: clamp(10px, 1.5vh, 16px);
  text-decoration: none;
  text-shadow: 2px 2px 3px #000;
}

.back:hover {
  color: #ff8d30;
  text-decoration: underline;
}

/* Smaller screens */
@media (max-width: 700px) {
  .page {
    min-width: 700px;
  }

  .viewport {
    overflow-x: auto;
  }

  .beer-name {
    font-size: 20px;
  }

  .beer-value {
    font-size: 14px;
  }

  .story-text {
    font-size: 12px;
  }

  .back {
    font-size: 11px;
  }
}
</style>
</head>

<body>

<div class="viewport">
<main class="page" aria-label="DeadBrewing beer details">

  <!-- Beer name -->
  <div class="beer-name" id="name">
    Loading beer...
  </div>

  <!-- Beer information -->
  <div class="beer-value" id="abv">—</div>

  <div class="beer-value" id="beer-style">—</div>

  <div class="beer-value" id="hops">—</div>

  <div class="beer-value" id="ibu">—</div>

  <!-- Story -->
  <div class="story-text" id="story"></div>

  <!-- Back to homepage -->
  <a class="back" href="index.html">
    ← Back to DeadBrewing
  </a>

</main>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const id = params.get("id");

fetch("beers.json")
  .then(response => {
    if (!response.ok) {
      throw new Error("Unable to load beer information");
    }
    return response.json();
  })

  .then(data => {
    const beer = data.beers.find(b => b.id === id);

    if (!beer) {
      throw new Error("Beer not found");
    }

    document.title = beer.name + " | DeadBrewing";

    document.getElementById("name").textContent =
      beer.name;

    document.getElementById("abv").textContent =
      beer.abv != null ? beer.abv + "%" : "—";

    document.getElementById("beer-style").textContent =
      beer.style || "—";

    document.getElementById("hops").textContent =
      beer.hops || "—";

    document.getElementById("ibu").textContent =
      beer.ibu ?? "—";

    document.getElementById("story").textContent =
      beer.story ||
      beer.description ||
      "The story of this beer is coming soon.";
  })

  .catch(error => {
    document.getElementById("name").textContent =
      error.message;
  });
</script>

</body>
</html>
