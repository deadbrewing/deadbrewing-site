
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beer | DeadBrewing</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: radial-gradient(ellipse at top, #421b12, #100909 65%);
  color: #f0dcc0;
  font-family: Georgia, serif;
}
.page {
  max-width: 950px;
  margin: 35px auto;
  padding: 20px;
}
header {
  text-align: center;
  padding: 25px;
  background: linear-gradient(#391711, #160d0c);
  border: 2px solid #a85a30;
  border-radius: 10px;
}
.brand {
  font-size: clamp(30px, 6vw, 60px);
  color: #f6b76a;
  font-weight: bold;
  text-shadow: 0 3px 8px #000, 0 0 18px #a43b13;
}
.subtitle { color: #d7b99c; letter-spacing: 3px; }
h1 {
  text-align: center;
  color: #ffc18b;
  font-size: clamp(30px, 5vw, 52px);
  margin-bottom: 8px;
}
.style { text-align: center; color: #d5bba5; }
.details {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
  margin-top: 30px;
}
.glass-panel {
  background: #24150f;
  border: 1px solid #87502e;
  border-radius: 12px;
  padding: 20px;
  text-align: center;
}
.glass-panel svg { width: 100%; max-width: 230px; height: 340px; }
.status { color: #ffc18b; font-weight: bold; }
.stats { display: grid; gap: 12px; }
.stat {
  background: #2a1913;
  border: 1px solid #87502e;
  border-radius: 8px;
  padding: 18px;
  text-align: center;
}
.stat strong { display: block; color: #ffc18b; font-size: 25px; }
.stat span { color: #ddc3ac; font-size: 13px; letter-spacing: 2px; }
.section {
  margin-top: 20px;
  padding: 24px;
  background: #211511;
  border: 1px solid #87502e;
  border-radius: 9px;
  line-height: 1.7;
}
.section h2 { margin-top: 0; color: #ffc18b; }
.back {
  display: block;
  text-align: center;
  margin: 30px auto;
  color: #ffc18b;
}
@media(max-width:600px) {
  .details { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div class="page">
  <header>
    <div class="brand">DEADBREWING</div>
    <div class="subtitle">EST. 2018 · FROM THE TAPROOM</div>
  </header>

  <h1 id="name">Loading beer...</h1>
  <p class="style" id="style"></p>

  <div class="details">
    <div class="glass-panel">
      <div id="glass"></div>
      <p class="status" id="status"></p>
    </div>
    <div class="stats">
      <div class="stat"><strong id="abv">—</strong><span>ABV</span></div>
      <div class="stat"><strong id="beer-style">—</strong><span>STYLE</span></div>
      <div class="stat"><strong id="hops">—</strong><span>HOPS</span></div>
    </div>
  </div>

  <div class="section">
    <h2>THE STORY</h2>
    <p id="story"></p>
  </div>

  <div class="section">
    <h2>TASTING NOTES</h2>
    <p id="tasting"></p>
  </div>

  <a class="back" href="index.html">← Back to DeadBrewing</a>
</div>

<script>
const params = new URLSearchParams(location.search);
const id = params.get('id');

function makeGlass(colour) {
  const safeColour = /^#[0-9a-fA-F]{3,8}$/.test(colour || '')
    ? colour : '#d68a28';

  return `
  <svg viewBox="0 0 150 230" role="img" aria-label="Beer glass">
    <defs>
      <linearGradient id="beerLiquid" x1="0" x2="1">
        <stop offset="0" stop-color="#ffe8a6"/>
        <stop offset=".22" stop-color="${safeColour}"/>
        <stop offset=".75" stop-color="${safeColour}"/>
        <stop offset="1" stop-color="#5e220d"/>
      </linearGradient>
    </defs>
    <path d="M29 26 Q20 80 39 135 Q48 158 69 166
             L81 166 Q102 158 111 135 Q130 80 121 26Z"
          fill="url(#beerLiquid)" stroke="#ffdb9e" stroke-width="4"/>
    <path d="M29 32 Q23 10 45 17 Q60 2 75 15
             Q92 5 104 16 Q126 9 121 32 L120 43 L30 43Z"
          fill="#fff0d5" stroke="#fff9e8" stroke-width="3"/>
    <path d="M69 166 L69 202 L51 209 L99 209
             L81 202 L81 166"
          fill="#e1b67e" stroke="#ffdfb3" stroke-width="2"/>
    <ellipse cx="75" cy="213" rx="43" ry="6"
             fill="#bc8d60" stroke="#ffe0b0" stroke-width="2"/>
    <text x="75" y="105" text-anchor="middle"
          font-size="32" fill="#ffd87d">✦</text>
  </svg>`;
}

fetch('beers.json')
  .then(response => {
    if (!response.ok) throw new Error('Beer data unavailable');
    return response.json();
  })
  .then(data => {
    const beer = data.beers.find(b => b.id === id);
    if (!beer) throw new Error('Beer not found');

    document.title = beer.name + ' | DeadBrewing';
    document.getElementById('name').textContent = beer.name;
    document.getElementById('style').textContent = beer.style || '';
    document.getElementById('beer-style').textContent = beer.style || '—';
    document.getElementById('abv').textContent = beer.abv + '%';
    document.getElementById('hops').textContent = beer.hops || '—';
    document.getElementById('status').textContent =
      beer.status === 'on-tap' ? 'ON TAP' : 'THE CRYPT';
    document.getElementById('story').textContent =
      beer.story || beer.description || 'Coming soon.';
    document.getElementById('tasting').textContent =
      beer.tastingNotes || 'Tasting notes coming soon.';
    document.getElementById('glass').innerHTML = makeGlass(beer.colour);
  })
  .catch(error => {
    document.getElementById('name').textContent = error.message;
  });
</script>
</body>
</html>
