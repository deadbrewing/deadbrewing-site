
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beer | DeadBrewing</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  min-height: 100%;
  background: #080606;
  color: #fff0d7;
  font-family: Georgia, serif;
}

/* Main artwork container */
.page {
  position: relative;
  width: min(100vw, 89.45vh);
  aspect-ratio: 1170 / 1308;
  margin: 0 auto;
  background-image: url("deadbrewing-beer-background.png");
  background-size: 100% 100%;
  background-position: center;
  background-repeat: no-repeat;
}

/* All editable text */
.beer-name,
.beer-value,
.story-text {
  position: absolute;
  text-align: center;
  z-index: 2;
}

/* Beer title plaque */
.beer-name {
  left: 54%;
  top: 20.5%;
  width: 40%;
  height: 10%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #ffe0b5;
  font-size: clamp(12px, 3.2vh, 37px);
  font-weight: bold;
  line-height: 1.05;
  text-shadow: 2px 3px 3px #000;
  overflow-wrap: anywhere;
}

/* Information values */
.beer-value {
  left: 70%;
  width: 23%;
  height: 5%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #ffe0b5;
  font-size: clamp(10px, 2.5vh, 27px);
  font-weight: bold;
  line-height: 1.05;
  text-shadow: 2px 2px 3px #000;
  overflow-wrap: anywhere;
}

#abv {
  top: 32.3%;
}

#beer-style {
  top: 39.3%;
}

#hops {
  top: 46.3%;
}

#ibu {
  top: 53.3%;
}

/* Story text on parchment */
.story-text {
  left: 15%;
  top: 72%;
  width: 70%;
  height: 17%;
  padding: 1%;
  color: #27150d;
  font-size: clamp(10px, 1.8vh, 21px);
  font-weight: bold;
  line-height: 1.35;
  overflow-y: auto;
  scrollbar-width: thin;
  scrollbar-color: #87502e transparent;
}

/* Back link */
.back {
  position: absolute;
  left: 32%;
  bottom: 2%;
  width: 36%;
  text-align: center;
  color: #ffe0b5;
  font-size: clamp(9px, 1.5vh, 16px);
  text-decoration: none;
  text-shadow: 2px 2px 3px #000;
  z-index: 3;
}

.back:hover {
  color: #ff8d30;
  text-decoration: underline;
}

/* Mobile: preserve readability */
@media (max-width: 700px) {
  .page {
    width: 100%;
  }

  .beer-name {
    font-size: clamp(12px, 3.5vw, 24px);
  }

  .beer-value {
    font-size: clamp(10px, 2.6vw, 19px);
  }

  .story-text {
    font-size: clamp(10px, 2.2vw, 16px);
  }

  .back {
    font-size: 11px;
  }
}
</style>
</head>

<body>

<main class="page" aria-label="DeadBrewing beer details">

  <!-- Beer name -->
  <div class="beer-name" id="name">
    Loading beer...
  </div>

  <!-- Beer information -->
  <div class="beer-value" id="abv">—</div>

  <div class="beer-value" id="beer-style">—</div>

  <div class="beer-value" id="hops">—</div>

  <div class="beer-value" id="ibu">—</div>

  <!-- Story -->
  <div class="story-text" id="story"></div>

  <!-- Return to homepage -->
  <a class="back" href="index.html">
    ← Back to DeadBrewing
  </a>

</main>

<script>
const params = new URLSearchParams(window.location.search);
const id = params.get("id");

fetch("beers.json")
  .then(response => {
    if (!response.ok) {
      throw new Error("Unable to load beer information");
    }

    return response.json();
  })

  .then(data => {
    const beer = data.beers.find(b => b.id === id);

    if (!beer) {
      throw new Error("Beer not found");
    }

    // Browser tab title
    document.title = beer.name + " | DeadBrewing";

    // Beer name
    document.getElementById("name").textContent =
      beer.name;

    // Alcohol percentage
    document.getElementById("abv").textContent =
      beer.abv != null ? beer.abv + "%" : "—";

    // Beer style
    document.getElementById("beer-style").textContent =
      beer.style || "—";

    // Hop varieties
    document.getElementById("hops").textContent =
      beer.hops || "—";

    // Bitterness
    document.getElementById("ibu").textContent =
      beer.ibu ?? "—";

    // Beer description and tasting notes
    document.getElementById("story").textContent =
      beer.story ||
      beer.description ||
      "The story of this beer is coming soon.";
  })

  .catch(error => {
    document.getElementById("name").textContent =
      error.message;
  });
</script>

</body>
</html>
