
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Beer | DeadBrewing</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #080606;
  color: #fff0d7;
  font-family: Georgia, serif;
}

/* Full-screen artwork - matches homepage */
.page {
  position: relative;
  width: 100vw;
  height: 100dvh;
  margin: 0;
  overflow: hidden;

  background-image:
    url("deadbrewing-beer-background.png?v=3");

  background-size: 100% 100%;
  background-position: center;
  background-repeat: no-repeat;
}

/* Editable beer information */
.beer-name,
.beer-value,
.story-text {
  position: absolute;
  z-index: 2;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  overflow-wrap: anywhere;
}

/* Beer name - upper-right plaque */
.beer-name {
  left: 60%;
  top: 17%;
  width: 35%;
  height: 11%;
  padding: 1%;

  color: #ffe0b5;
  font-size: clamp(12px, 3.5vh, 40px);
  font-weight: bold;
  line-height: 1.05;
  text-shadow: 2px 3px 4px #000;
}

/* ABV, style, hops and IBU */
.beer-value {
  left: 75%;
  width: 19%;
  height: 6%;

  color: #ffe0b5;
  font-size: clamp(10px, 2.5vh, 27px);
  font-weight: bold;
  line-height: 1.1;
  text-shadow: 2px 2px 3px #000;
}

#abv {
  top: 31%;
}

#beer-style {
  top: 39%;
}

#hops {
  top: 47%;
}

#ibu {
  top: 55%;
}

/* Story parchment */
.story-text {
  left: 11%;
  top: 72%;
  width: 78%;
  height: 18%;
  padding: 1%;

  color: #28150d;
  font-size: clamp(10px, 2vh, 22px);
  font-weight: bold;
  line-height: 1.35;

  overflow-y: auto;
  scrollbar-width: thin;
  scrollbar-color: #87502e transparent;
}

/*
  Back to DeadBrewing

  Uses the actual button artwork extracted
  from The Crypt.

  The link remains fully clickable.
*/
.back {
  position: absolute;
  left: 5%;
  bottom: 2%;
  width: 21%;
  height: 7%;
  z-index: 5;

  display: block;

  background-image:
    url("deadbrewing-back-button.png");

  background-size: 100% 100%;
  background-position: center;
  background-repeat: no-repeat;

  /* Hide HTML text because it is
     already printed on the image */
  color: transparent;
  font-size: 0;
  text-decoration: none;

  transition: filter 0.2s ease;
}

.back:hover,
.back:focus-visible {
  filter: brightness(1.2);
}

.back:focus-visible {
  outline: 2px solid #ffb65c;
  outline-offset: 3px;
}

/* Mobile text sizing */
@media (max-width: 700px) {
  .beer-name {
    font-size: clamp(10px, 2.5vw, 20px);
  }

  .beer-value {
    font-size: clamp(8px, 1.8vw, 14px);
  }

  .story-text {
    font-size: clamp(8px, 1.6vw, 12px);
  }
}
</style>
</head>

<body>

<main class="page" aria-label="DeadBrewing beer details">

  <!-- Beer name -->
  <div class="beer-name" id="name">
    Loading beer...
  </div>

  <!-- Beer information -->
  <div class="beer-value" id="abv">—</div>
  <div class="beer-value" id="beer-style">—</div>
  <div class="beer-value" id="hops">—</div>
  <div class="beer-value" id="ibu">—</div>

  <!-- Beer story -->
  <div class="story-text" id="story"></div>

  <!-- Back to homepage -->
  <a
    class="back"
    href="index.html"
    aria-label="Back to DeadBrewing homepage">
  </a>

</main>

<script>
"use strict";

const params = new URLSearchParams(window.location.search);
const id = params.get("id");

/* Load the selected beer */
fetch("beers.json", { cache: "no-store" })

  .then(response => {
    if (!response.ok) {
      throw new Error("Unable to load beer information");
    }

    return response.json();
  })

  .then(data => {
    const beer = data.beers.find(b => b.id === id);

    if (!beer) {
      throw new Error("Beer not found");
    }

    /* Browser tab */
    document.title = beer.name + " | DeadBrewing";

    /* Beer name */
    document.getElementById("name").textContent =
      beer.name;

    /* Alcohol percentage */
    document.getElementById("abv").textContent =
      beer.abv != null ? beer.abv + "%" : "—";

    /* Beer style */
    document.getElementById("beer-style").textContent =
      beer.style || "—";

    /* Hops */
    document.getElementById("hops").textContent =
      beer.hops || "—";

    /* Bitterness */
    document.getElementById("ibu").textContent =
      beer.ibu ?? "—";

    /* Description and tasting notes */
    document.getElementById("story").textContent =
      beer.story ||
      beer.description ||
      "The story of this beer is coming soon.";
  })

  .catch(error => {
    console.error("DeadBrewing beer details:", error);

    document.getElementById("name").textContent =
      error.message;
  });
</script>

</body>
</html>
